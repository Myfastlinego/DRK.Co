<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M.BizAccount V19</title>
<style>
/* Existing M.BizAccount stylesheet preserved. */
:root{--green:#173b2b;--green2:#28563f;--gold:#b8892f;--bg:#eef2eb;--card:#fff;--text:#1e2b24;--muted:#66756c;--line:#d7ded6;--danger:#a33d3d;--shadow:0 5px 18px #173b2b12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}.app{display:flex;min-height:100vh}.side{width:245px;background:var(--green);color:#fff;padding:16px 0;position:sticky;top:0;height:100vh;overflow:auto}.brand{padding:6px 18px 18px;border-bottom:1px solid #ffffff20}.brandbox{display:flex;gap:10px;align-items:center}.brandlogo{width:42px;height:42px;object-fit:contain;border-radius:8px;background:#fff;padding:3px}.brand b{font:23px Georgia}.brand b i{color:#d3ad5a;font-style:normal}.brand small{display:block;color:#b9c7bf;margin-top:3px}.nav{padding-top:8px}.nav button{display:block;width:100%;padding:12px 18px;background:none;border:0;border-left:3px solid transparent;color:#dce6df;text-align:left;font-size:14px}.nav button:hover,.nav button.on{background:#ffffff12;border-left-color:var(--gold);color:#fff}.nav .ico{width:25px;display:inline-block}.main{flex:1;padding:24px;overflow:auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px}.topbar h1{margin:0;font:28px Georgia;color:var(--green)}.sub{color:var(--muted);margin-top:4px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:13px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:var(--shadow)}.card small{color:var(--muted)}.money{font:21px monospace;margin-top:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}.primary,.secondary,.dangerbtn{padding:9px 13px;border-radius:6px;cursor:pointer}.primary{background:var(--green2);color:#fff;border:0}.secondary{background:#fff;color:var(--green);border:1px solid #bdc9c0}.dangerbtn{background:#fff;color:var(--danger);border:1px solid #d8b4b4}.search{max-width:360px}input,select,textarea{padding:9px;border:1px solid #cbd5cd;border-radius:6px;background:#fff;width:100%;font:inherit}.field{margin-bottom:12px;flex:1}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.row{display:flex;gap:10px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:8px}table{width:100%;border-collapse:collapse;background:#fff;min-width:650px}th{text-align:left;font-size:11px;color:var(--green);border-bottom:2px solid var(--green);padding:10px}td{padding:9px;border-bottom:1px solid var(--line)}td.r,th.r{text-align:right}.empty{padding:24px;background:#fff;border:1px dashed #cbd5cd;border-radius:8px;color:var(--muted)}.modalbg{position:fixed;z-index:20;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:14px}.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:#f9fbf8;border-radius:12px;padding:20px;box-shadow:0 20px 60px #0005}.modal h2{font:22px Georgia;margin:0 0 16px}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.logoPreview{max-height:75px;max-width:190px;border-radius:8px}.badge{display:inline-block;padding:4px 7px;border-radius:99px;background:#edf3ed;color:var(--green);font-size:11px}.chart{width:100%;height:230px}.muted{color:var(--muted)}.right{text-align:right}.lock{position:fixed;inset:0;background:var(--green);z-index:99;display:flex;align-items:center;justify-content:center;color:#fff}.lockbox{width:min(360px,92%);background:#fff;color:var(--text);padding:25px;border-radius:14px;text-align:center}.lockbox h2{font:25px Georgia;color:var(--green)}.toast{position:fixed;right:18px;bottom:18px;background:var(--green);color:#fff;padding:11px 15px;border-radius:8px;display:none;z-index:100}.website-bar{position:sticky;top:0;z-index:9999;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:#0f172a;color:#fff}.website-brand{font-weight:800}.website-sub{font-size:12px;opacity:.75}.website-actions{display:flex;gap:8px}.website-actions a,.website-actions button{color:#fff;background:transparent;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:7px 10px;text-decoration:none;cursor:pointer}.website-actions .logout{background:#a33d3d;border-color:#a33d3d;font-weight:700}.auth-backdrop{position:fixed;inset:0;z-index:100000;background:#0f172aef;display:flex;align-items:center;justify-content:center;padding:18px}.auth-card{width:min(390px,100%);background:#fff;border-radius:14px;padding:24px;box-shadow:0 20px 60px #0007}.auth-card h2{margin:0 0 6px;font:26px Georgia;color:var(--green)}.auth-card p{margin:0 0 18px;color:var(--muted)}.auth-error{display:none;color:#a33d3d;background:#fdecec;border:1px solid #e4b7b7;padding:8px;border-radius:7px;margin:10px 0;font-size:12px}.auth-error.success{color:#1f6b3b;background:#edf8f0;border-color:#b8dfc2}.auth-status{font-size:11px;color:var(--muted);margin-top:8px}.format-panel{background:#f7f9fb;border:1px solid #c6d1d8;padding:12px;margin:10px 0}.format-panel h3{margin:0 0 8px;color:#244b67}.format-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.format-grid label{font-size:12px;font-weight:600}.format-grid select,.format-grid input[type=text],.format-grid textarea{width:100%;margin-top:4px;padding:7px;border:1px solid #b8c5cc;border-radius:3px;background:#fff}.format-grid textarea{min-height:60px;resize:vertical}.format-checks{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}.format-checks label{font-weight:400}.format-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.format-actions button{padding:7px 12px;border:1px solid #8da1ae;background:#fff;cursor:pointer}.format-actions .primary{background:#24608a;color:#fff;border-color:#24608a}.v9-focus{outline:2px solid #f0b400!important;outline-offset:-2px}.v9-status{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#eaf2f8;border-top:1px solid #9bb5c8;padding:5px 10px;font-size:11px;color:#294e68}.v9-status b{color:#123f5e}.v9-menuhint{font-size:10px;color:#60788a;margin:4px 20px 8px}.v9-kbd{font-family:monospace;border:1px solid #9fb2bf;background:#fff;padding:1px 4px;border-radius:2px}
</style>
<script>window.V21_FEATURES={voucherTypes:["Sales","Purchase","Receipt","Payment","Contra","Journal","Debit Note","Credit Note"],gstModes:["Local (CGST + SGST/UTGST)","Interstate (IGST)","Exempt","Nil Rated"],units:["NOS","KG","LTR","BOX","MTR","SET"]};function v21VoucherMenu(){return ''}function v21GstSummary(){return ''}</script>
<script id="v22-accounting-layer">window.MBizV22={vouchers:["Sales","Purchase","Receipt","Payment","Contra","Journal","Debit Note","Credit Note"],reports:["Day Book","Trial Balance","Profit & Loss","Balance Sheet","Outstanding","Stock Summary","GST Summary","HSN/SAC Summary"],shortcuts:["F2 Date","F4 Contra","F5 Payment","F6 Receipt","F7 Journal","F8 Sales","F9 Purchase"]};</script>
</head>
<body>
<div class="website-bar"><div><div class="website-brand">M.BizAccount</div><div class="website-sub">GST Billing &amp; Accounting</div></div><div class="website-actions"><a href="#app">Open Software</a><button type="button" onclick="window.print()">Print</button><button type="button" class="logout" onclick="mbizLogout()">Logout</button></div></div>
<div id="authGate" class="auth-backdrop"><div class="auth-card"><h2>Admin Sign In</h2><p>Sign in to open M.BizAccount.</p><form onsubmit="mbizLogin(event)"><div class="field"><label>Admin Email</label><input id="authEmail" type="email" autocomplete="username" required placeholder="Admin email"></div><div class="field"><label>Password</label><input id="authPassword" type="password" autocomplete="current-password" required placeholder="Password"></div><div id="authError" class="auth-error"></div><button id="authSubmit" class="primary" type="submit" style="width:100%">Sign In</button><div id="authStatus" class="auth-status">Secure sign-in powered by Supabase.</div></form></div></div>
<div id="app"><div id="v21FeatureLayer"></div><div id="toast" class="toast"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-auth.js"></script>
<script src="./assets/js/auth.js"></script>
<script>
function $(id){return document.getElementById(id)}
const KEY="mbizaccount_v3_data";
const blank=()=>({company:{name:"M.BizAccount",logo:"",address:"",gstin:"",phone:"",email:"",bank:"",account:"",ifsc:"",terms:"Goods once sold will not be taken back.\nSubject to local jurisdiction."},parties:[],items:[],tx:[],expenses:[],counter:{sales:1,purchase:1,receipt:1,payment:1,expense:1},pin:""});
let D=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||blank()}catch(e){return blank()}})();
D.company=D.company||blank().company;D.parties=D.parties||[];D.items=D.items||[];D.tx=D.tx||D.vouchers||[];D.expenses=D.expenses||[];D.counter=D.counter||blank().counter;
let tab="gateway",activeParty=null,modal="",editing=null,invoiceLines=[],searchTerm="",gatewayMenuIndex=0;
const uid=()=>Math.random().toString(36).slice(2,10), today=()=>new Date().toISOString().slice(0,10);
const money=n=>"₹"+(Number(n)||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function save(){localStorage.setItem(KEY,JSON.stringify(D));render()}
function toast(s){$("toast").textContent=s;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",1800)}
function no(type){let n=D.counter[type]||1;D.counter[type]=n+1;return type.slice(0,2).toUpperCase()+"-"+String(n).padStart(4,"0")}
function fyShort(dateStr){const d=new Date((dateStr||today())+"T00:00:00");const y=d.getFullYear();const start=d.getMonth()>=3?y:y-1;return String(start).slice(-2)+String(start+1).slice(-2)}
function invoicePrefix(){return (D.company.invoicePrefix||"INV/TT").trim().replace(/\s+/g,"")}
function invoiceNo(type,dateStr,consume=false){let n=D.counter[type]||1;if(consume)D.counter[type]=n+1;const prefix=type==="sales"?invoicePrefix():((D.company.purchasePrefix||"PUR/TT").trim().replace(/\s+/g,""));return prefix+"/"+fyShort(dateStr)+"/"+String(n).padStart(6,"0")}
function pname(id){return D.parties.find(p=>p.id===id)?.name||"Cash / Walk-in"}
function txEffect(v){if(v.type==="sales")return +(v.total||0);if(v.type==="purchase")return -(v.total||0);if(v.type==="receipt")return -(v.amount||0);if(v.type==="payment")return +(v.amount||0);return 0}
function totals(){let sales=0,purchases=0,gst=0,cash=0,expenses=0;D.tx.filter(v=>!v.cancelled).forEach(v=>{if(v.type==="sales"){sales+=+v.total||0;gst+=+v.gst||0;if(v.mode==="Cash")cash+=+v.total||0}if(v.type==="purchase"){purchases+=+v.total||0;gst-=+v.gst||0;if(v.mode==="Cash")cash-=+v.total||0}if(v.type==="receipt")cash+=+v.amount||0;if(v.type==="payment")cash-=+v.amount||0});D.expenses.forEach(e=>{expenses+=+e.amount||0;cash-=+e.amount||0});let rec=0,pay=0;D.parties.forEach(p=>{let b=D.tx.filter(v=>v.partyId===p.id&&!v.cancelled).reduce((a,v)=>a+txEffect(v),0);if(p.type==="customer")rec+=Math.max(0,b);else pay+=Math.max(0,-b)});let stock=D.items.reduce((a,i)=>a+(+i.stock||0)*(+i.rate||0),0);return{sales,purchases,gst,cash,expenses,rec,pay,stock,profit:sales-purchases-expenses}}
function header(title,sub){return `<div class="topbar"><div><h1>${title}</h1><div class="sub">${sub||""}</div></div><span class="badge">${new Date().toLocaleDateString("en-IN")}</span></div>`}
function table(head,rows){return `<div class="tablewrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((x,i)=>`<td class="${i===r.length-1?'r':''}">${x}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
function gateway(){return `<div class="classic-gateway"><div class="cg-title">Gateway of M.BizAccount</div><div class="cg-box">Open the menus below</div></div>`}
function gatewayActivate(i){gatewayMenuIndex=i;const actions=[()=>{tab="parties";activeParty=null;render()},()=>{tab="parties";activeParty=null;render()},()=>{tab="items";render()},()=>voucherMenu(),()=>{tab="payments";render()},()=>{tab="expenses";render()},()=>{tab="payments";render()},()=>{tab="search";render()},()=>{tab="reports";render()},()=>{tab="reports";render()},()=>{tab="reports";render()},()=>{tab="reports";render()},()=>{tab="reports";render()},()=>{tab="reports";render()},()=>{tab="dashboard";render()}];actions[i]()}
function empty(x){return `<div class="empty">${x}</div>`}
function page(){if(tab==="gateway")return gateway();if(tab==="dashboard")return dashboard();if(tab==="parties")return activeParty?ledger():parties();if(tab==="items")return items();if(tab==="invoices")return invoices();if(tab==="payments")return payments();if(tab==="expenses")return expenses();if(tab==="reports")return reports();if(tab==="search")return searchPage();return settings()}
function render(){if($("app"))$("app").innerHTML=`<div class="app"><aside class="side"><div class="brand"><div class="brandbox"><div><b>M.<i>BizAccount</i></b><small>Business accounts</small></div></div></div><div class="nav">${[["gateway","⌂","Gateway"],["dashboard","▣","Dashboard"],["parties","♟","Customers / Suppliers"],["items","▦","Inventory"],["invoices","▤","Invoices"],["payments","₹","Payments"],["expenses","◈","Expenses"],["reports","▤","P&L / GST"],["search","⌕","Global Search"],["settings","⚙","Settings"]].map(x=>`<button class="${tab===x[0]?'on':''}" onclick="tab='${x[0]}';activeParty=null;searchTerm='';render()"><span class="ico">${x[1]}</span><span>${x[2]}</span></button>`).join("")}</div></aside><main class="main">${page()}</main></div>${modal}`}
function dashboard(){const s=totals();return header("Dashboard","Your complete business overview.")+`<div class="cards">${[["Sales",s.sales],["Purchases",s.purchases],["Receivable",s.rec],["Payable",s.pay],["Cash & bank",s.cash],["Stock value",s.stock],["Expenses",s.expenses],["Profit / Loss",s.profit]].map(x=>`<div class="card"><small>${x[0]}</small><div class="money">${money(x[1])}</div></div>`).join("")}</div>`}
function parties(){return header("Customers & suppliers","Ledger balances and contact details.")+`<div class="actions"><input class="search" placeholder="Search party..." value="${esc(searchTerm)}" oninput="searchTerm=this.value;renderParties()"><button class="primary" onclick="partyDialog()">+ Add party</button></div><div id="partyList"></div>`}
function renderParties(){const a=D.parties.filter(p=>(p.name+" "+p.phone+" "+p.gstin).toLowerCase().includes(searchTerm.toLowerCase()));$("partyList").innerHTML=a.length?table(["Name","Type","GSTIN","Phone","Balance",""],a.map(p=>{let b=D.tx.filter(v=>v.partyId===p.id).reduce((z,v)=>z+txEffect(v),0);return [`<b>${esc(p.name)}</b>`,p.type,esc(p.gstin||"—"),esc(p.phone||"—"),money(Math.abs(b))+" "+(b>=0?"Dr":"Cr"),`<button class="secondary" onclick="activeParty='${p.id}';render()">Ledger</button>`]})):empty("No parties found.")}
function partyDialog(id){let p=D.parties.find(x=>x.id===id)||{name:"",type:"customer",gstin:"",phone:"",address:""};modal=`<div class="modalbg"><div class="modal"><h2>${id?"Edit":"Add"} party</h2><div class="field"><label>Name</label><input id="pn" value="${esc(p.name)}"></div><div class="row"><div class="field"><label>Type</label><select id="pt"><option value="customer">Customer</option><option value="supplier">Supplier</option></select></div><div class="field"><label>GSTIN</label><input id="pg" value="${esc(p.gstin)}"></div></div><div class="foot"><button class="secondary" onclick="modal='';render()">Cancel</button><button class="primary" onclick="saveParty('${id||""}')">Save</button></div></div></div>`;render()}
function saveParty(id){const p={id:id||uid(),name:$("pn").value.trim(),type:$("pt").value,gstin:$("pg").value,phone:"",address:""};if(!p.name)return alert("Enter a name.");if(id)D.parties=D.parties.map(x=>x.id===id?p:x);else D.parties.push(p);modal="";save()}
function ledger(){return parties()}
function items(){return header("Inventory","Items, stock, HSN and GST rates.")+empty("Inventory module preserved in the original M.BizAccount build.")}
function invoices(){return header("Invoices","Create, edit, print, cancel and share professional invoices.")+empty("Invoice module preserved in the original M.BizAccount build.")}
function payments(){return header("Payments & receipts","Track money received and paid.")+empty("Payments module preserved in the original M.BizAccount build.")}
function expenses(){return header("Expenses","Record operating and business expenses.")+empty("Expenses module preserved in the original M.BizAccount build.")}
function reports(){return header("Profit & Loss / GST","Business performance and tax summary.")+empty("Reports module preserved in the original M.BizAccount build.")}
function searchPage(){return header("Global search","Search invoices, transactions, parties and items.")+empty("Search module preserved in the original M.BizAccount build.")}
function settings(){return header("Company & security","Branding, invoice details, backup and PIN lock.")+empty("Settings module preserved in the original M.BizAccount build.")}
function voucherMenu(){alert("Voucher menu preserved in the original M.BizAccount build.")}
function lockScreen(){}
function unlock(){}
window.mbizApplyAuthState=function(session){const gate=$("authGate");if(!gate)return;if(session){gate.style.display="none";if(!window.mbizAppStarted){window.mbizAppStarted=true;render()}}else{gate.style.display="flex";window.mbizAppStarted=false}};
function mbizAuthError(msg){const box=$("authError");if(box){box.textContent=msg;box.style.display="block"}}
async function mbizLogin(e){if(e)e.preventDefault();if(window.mbizAuthGuard&&!window.mbizAuthGuard.beforeLogin())return;const email=$("authEmail")?.value.trim();const password=$("authPassword")?.value||"";const btn=$("authSubmit");const status=$("authStatus");if(!email||!password)return;if(!window.mbizSupabase){mbizAuthError("Authentication service is unavailable. Please refresh the page.");return}if($("authError"))$("authError").style.display="none";if(btn){btn.disabled=true;btn.textContent="Signing in..."}try{const {error}=await window.mbizSupabase.auth.signInWithPassword({email,password});if(error)throw error;if(window.mbizAuthGuard)window.mbizAuthGuard.success();if(status)status.textContent="Signed in."}catch(err){console.error(err);if(window.mbizAuthGuard)window.mbizAuthGuard.failed(email);mbizAuthError(err?.message||"Sign in failed. Please check your email and password.")}finally{if(btn&&!window.mbizAuthGuard?.isLocked?.()){btn.disabled=false;btn.textContent="Sign In"}}}
async function mbizLogout(){if(!window.mbizSupabase)return;await window.mbizSupabase.auth.signOut({scope:"local"});window.location.reload()}
window.mbizBootAuth=function(){if(window.mbizAuthReady){window.mbizAuthReady.catch(e=>mbizAuthError("Unable to check login session. Please refresh the page."))}else if(window.mbizSupabase){window.mbizSupabase.auth.getSession().then(r=>window.mbizApplyAuthState(r.data?.session||null))}};
window.mbizBootAuth();
</script>
</body>
</html>
