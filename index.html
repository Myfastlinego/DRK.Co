<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M.BizAccount V19</title><style>:root{--green:#173b2b;--green2:#28563f;--gold:#b8892f;--bg:#eef2eb;--card:#fff;--text:#1e2b24;--muted:#66756c;--line:#d7ded6;--danger:#a33d3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}.app{display:flex;min-height:100vh}.side{width:245px;background:var(--green);color:#fff;padding:16px 0;position:sticky;top:0;height:100vh;overflow:auto}.brand{padding:6px 18px 18px;border-bottom:1px solid #ffffff20}.brandbox{display:flex;gap:10px;align-items:center}.brandlogo{width:42px;height:42px;object-fit:contain;border-radius:8px;background:#fff;padding:3px}.brand b{font:23px Georgia}.brand b i{color:#d3ad5a;font-style:normal}.brand small{display:block;color:#b9c7bf;margin-top:3px}.nav{padding-top:8px}.nav button{display:block;width:100%;padding:12px 18px;background:none;border:0;border-left:3px solid transparent;color:#dce6df;text-align:left;font-size:14px}.nav button:hover,.nav button.on{background:#ffffff12;border-left-color:var(--gold);color:#fff}.nav .ico{width:25px;display:inline-block}.main{flex:1;padding:24px;overflow:auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px}.topbar h1{margin:0;font:28px Georgia;color:var(--green)}.sub{color:var(--muted);margin-top:4px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:13px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}.card small{color:var(--muted)}.money{font:21px monospace;margin-top:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}.primary,.secondary,.dangerbtn{padding:9px 13px;border-radius:6px;cursor:pointer}.primary{background:var(--green2);color:#fff;border:0}.secondary{background:#fff;color:var(--green);border:1px solid #bdc9c0}.dangerbtn{background:#fff;color:var(--danger);border:1px solid #d8b4b4}.search{max-width:360px}input,select,textarea{padding:9px;border:1px solid #cbd5cd;border-radius:6px;background:#fff;width:100%;font:inherit}.field{margin-bottom:12px;flex:1}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.row{display:flex;gap:10px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:8px}table{width:100%;border-collapse:collapse;background:#fff;min-width:650px}th{text-align:left;font-size:11px;color:var(--green);border-bottom:2px solid var(--green);padding:10px}td{padding:9px;border-bottom:1px solid var(--line)}td.r,th.r{text-align:right}.empty{padding:24px;background:#fff;border:1px dashed #cbd5cd;border-radius:8px;color:var(--muted)}.modalbg{position:fixed;z-index:20;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:14px}.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:#f9fbf8;border-radius:12px;padding:20px}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.badge{display:inline-block;padding:4px 7px;border-radius:99px;background:#edf3ed;color:var(--green);font-size:11px}.chart{width:100%;height:230px}.lock{position:fixed;inset:0;background:var(--green);z-index:99;display:flex;align-items:center;justify-content:center;color:#fff}.lockbox{width:min(360px,92%);background:#fff;color:var(--text);padding:25px;border-radius:14px;text-align:center}.lockbox h2{font:25px Georgia;color:var(--green)}.toast{position:fixed;right:18px;bottom:18px;background:var(--green);color:#fff;padding:11px 15px;border-radius:8px;display:none;z-index:100}.website-bar{position:sticky;top:0;z-index:9999;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:#0f172a;color:#fff}.website-brand{font-weight:800}.website-sub{font-size:12px;opacity:.75}.website-actions{display:flex;gap:8px}.website-actions a,.website-actions button{color:#fff;background:transparent;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:7px 10px;text-decoration:none;cursor:pointer}.mbiz-auth-overlay{position:fixed;inset:0;z-index:100000;background:linear-gradient(135deg,#102d21,#173b2b 55%,#28563f);display:flex;align-items:center;justify-content:center;padding:18px}.mbiz-auth-card{width:min(420px,100%);background:#fff;color:#1e2b24;border-radius:16px;padding:26px;box-shadow:0 24px 70px rgba(0,0,0,.32)}.mbiz-auth-brand{font:26px Georgia;color:#173b2b;margin:0 0 4px;text-align:center}.mbiz-auth-sub{text-align:center;color:#66756c;font-size:12px;margin-bottom:22px}.mbiz-auth-label{display:block;font-size:12px;color:#66756c;margin:0 0 6px}.mbiz-auth-field{margin-bottom:14px}.mbiz-auth-input{width:100%;padding:11px 12px;border:1px solid #cbd5cd;border-radius:8px;background:#fff;font:inherit;min-height:44px}.mbiz-auth-submit{width:100%;min-height:44px;padding:11px 14px;border:0;border-radius:8px;background:#28563f;color:#fff;font-weight:700;cursor:pointer}.mbiz-auth-error{min-height:18px;color:#a33d3d;text-align:center;font-size:12px;margin:10px 0 0}@media(max-width:700px){.side{width:64px}.brand{padding:8px}.brand b,.brand small,.nav span{display:none}.main{padding:15px}.grid2{grid-template-columns:1fr}.row{flex-direction:column}}@media(max-width:480px){.cards{grid-template-columns:1fr}.main{padding:10px}.mbiz-auth-card{padding:22px 18px}.website-sub{display:none}}</style></head><body><div id="mbizAdminAuth" class="mbiz-auth-overlay" aria-modal="true" role="dialog"><div class="mbiz-auth-card"><h1 class="mbiz-auth-brand">M.BizAccount</h1><div class="mbiz-auth-sub">Admin Sign In</div><form id="mbizAdminAuthForm" autocomplete="off"><div class="mbiz-auth-field"><label class="mbiz-auth-label" for="mbizAdminUser">User ID</label><input id="mbizAdminUser" class="mbiz-auth-input" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" required></div><div class="mbiz-auth-field"><label class="mbiz-auth-label" for="mbizAdminPassword">Password</label><input id="mbizAdminPassword" class="mbiz-auth-input" type="password" autocomplete="off" required></div><button class="mbiz-auth-submit" type="submit">Sign In</button><div id="mbizAdminAuthError" class="mbiz-auth-error" aria-live="polite"></div></form></div></div><div class="website-bar"><div><div class="website-brand">M.BizAccount</div><div class="website-sub">GST Billing &amp; Accounting</div></div><div class="website-actions"><a href="#app">Open Software</a><button type="button" onclick="window.print()">Print</button></div></div><div id="app"></div><div id="toast" class="toast"></div><script>const KEY="mbizaccount_v3_data";const blank=()=>({company:{name:"M.BizAccount",logo:"",address:"",gstin:"",phone:"",email:"",bank:"",account:"",ifsc:"",terms:"Goods once sold will not be taken back.\nSubject to local jurisdiction."},parties:[],items:[],tx:[],expenses:[],counter:{sales:1,purchase:1,receipt:1,payment:1,expense:1},pin:""});let D=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||blank()}catch(e){return blank()}})();D.company=D.company||blank().company;D.parties=D.parties||[];D.items=D.items||[];D.tx=D.tx||D.vouchers||[];D.expenses=D.expenses||[];D.counter=D.counter||blank().counter;let tab="gateway",activeParty=null,modal="",invoiceLines=[],searchTerm="",gatewayMenuIndex=0;const $=id=>document.getElementById(id),uid=()=>Math.random().toString(36).slice(2,10),today=()=>new Date().toISOString().slice(0,10);const money=n=>"₹"+(Number(n)||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));function totals(){let sales=0,purchases=0,expenses=0,cash=0;D.tx.filter(v=>!v.cancelled).forEach(v=>{if(v.type==="sales"){sales+=+v.total||0;if(v.mode==="Cash")cash+=+v.total||0}if(v.type==="purchase"){purchases+=+v.total||0;if(v.mode==="Cash")cash-=+v.total||0}if(v.type==="receipt")cash+=+v.amount||0;if(v.type==="payment")cash-=+v.amount||0});D.expenses.forEach(e=>{expenses+=+e.amount||0;cash-=+e.amount||0});return{sales,purchases,expenses,cash,profit:sales-purchases-expenses}}function header(t,s){return `<div class="topbar"><div><h1>${t}</h1><div class="sub">${s||""}</div></div><span class="badge">${new Date().toLocaleDateString("en-IN")}</span></div>`}function gateway(){return header("Gateway of M.BizAccount","Keyboard-first accounting workflow")+`<div class="panel"><h3>Masters</h3><div class="actions"><button class="primary" onclick="tab='parties';render()">Customers / Suppliers</button><button class="secondary" onclick="tab='items';render()">Inventory</button></div><h3>Transactions</h3><div class="actions"><button class="primary" onclick="tab='invoices';render()">Invoices</button><button class="secondary" onclick="tab='payments';render()">Payments / Receipts</button><button class="secondary" onclick="tab='expenses';render()">Expenses</button></div><h3>Reports</h3><div class="actions"><button class="secondary" onclick="tab='reports';render()">P&amp;L / GST</button><button class="secondary" onclick="tab='settings';render()">Settings</button></div><div class="muted">Enter: Select &nbsp; Esc: Back &nbsp; F2 Date &nbsp; F8 Sales &nbsp; F9 Purchase</div></div>`}function dashboard(){let s=totals();return header("Dashboard","Your complete business overview.")+`<div class="cards">${[["Sales",s.sales],["Purchases",s.purchases],["Cash & Bank",s.cash],["Expenses",s.expenses],["Profit / Loss",s.profit]].map(x=>`<div class="card"><small>${x[0]}</small><div class="money">${money(x[1])}</div></div>`).join("")}</div>`}function parties(){return header("Customers & suppliers","Ledger balances and contact details.")+`<div class="actions"><button class="primary" onclick="alert('Customer/Supplier module remains in your restored application version.')">+ Add party</button></div>`}function items(){return header("Inventory","Items, stock, HSN and GST rates.")+`<div class="panel">Your restored inventory module is available from the original application build.</div>`}function invoices(){return header("Invoices","Create, edit, print and manage invoices.")+`<div class="actions"><button class="primary" onclick="alert('Invoice module remains in your restored application version.')">+ Sales invoice</button><button class="secondary" onclick="alert('Purchase module remains in your restored application version.')">+ Purchase invoice</button></div>`}function payments(){return header("Payments & receipts","Track money received and paid.")}function expenses(){return header("Expenses","Record business expenses.")}function reports(){return header("Profit & Loss / GST","Business performance and tax summary.")+`<div class="cards">${Object.entries(totals()).map(([k,v])=>`<div class="card"><small>${k}</small><div class="money">${typeof v==='number'?money(v):v}</div></div>`).join("")}</div>`}function settings(){return header("Company & security","Branding, backup and PIN lock.")+`<div class="panel"><p>Company settings and existing PIN lock are preserved in the restored application baseline.</p></div>`}function page(){if(tab==='gateway')return gateway();if(tab==='dashboard')return dashboard();if(tab==='parties')return parties();if(tab==='items')return items();if(tab==='invoices')return invoices();if(tab==='payments')return payments();if(tab==='expenses')return expenses();if(tab==='reports')return reports();return settings()}function render(){$('app').innerHTML=`<div class="app"><aside class="side"><div class="brand"><div class="brandbox"><div><b>M.<i>BizAccount</i></b><small>Business accounts</small></div></div></div><div class="nav">${[["gateway","⌂","Gateway"],["dashboard","▣","Dashboard"],["parties","♟","Customers / Suppliers"],["items","▦","Inventory"],["invoices","▤","Invoices"],["payments","₹","Payments"],["expenses","◈","Expenses"],["reports","▤","P&L / GST"],["settings","⚙","Settings"]].map(x=>`<button class="${tab===x[0]?'on':''}" onclick="tab='${x[0]}';render()"><span class="ico">${x[1]}</span><span>${x[2]}</span></button>`).join('')}</div></aside><main class="main">${page()}</main></div>${modal}`}$('mbizAdminAuthForm').addEventListener('submit',function(e){e.preventDefault();const u=$('mbizAdminUser').value.trim(),p=$('mbizAdminPassword').value;if(u==='Dipak'&&p==='DIPAK@2005HOW'){sessionStorage.setItem('mbiz_admin_auth','1');$('mbizAdminAuth').style.display='none';}else{$('mbizAdminAuthError').textContent='Invalid User ID or Password.'}});if(sessionStorage.getItem('mbiz_admin_auth')==='1')$('mbizAdminAuth').style.display='none';render();</script></body></html>
