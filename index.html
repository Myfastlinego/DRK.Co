<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>M.BizAccount V19</title>
<style>
:root{--green:#173b2b;--green2:#28563f;--gold:#b8892f;--bg:#eef2eb;--card:#fff;--text:#1e2b24;--muted:#66756c;--line:#d7ded6;--danger:#a33d3d;--shadow:0 5px 18px #173b2b12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}.app{display:flex;min-height:100vh}.side{width:245px;background:var(--green);color:#fff;padding:16px 0;position:sticky;top:0;height:100vh;overflow:auto}.brand{padding:6px 18px 18px;border-bottom:1px solid #ffffff20}.brandbox{display:flex;gap:10px;align-items:center}.brandlogo{width:42px;height:42px;object-fit:contain;border-radius:8px;background:#fff;padding:3px}.brand b{font:23px Georgia}.brand b i{color:#d3ad5a;font-style:normal}.brand small{display:block;color:#b9c7bf;margin-top:3px}.nav{padding-top:8px}.nav button{display:block;width:100%;padding:12px 18px;background:none;border:0;border-left:3px solid transparent;color:#dce6df;text-align:left;font-size:14px}.nav button:hover,.nav button.on{background:#ffffff12;border-left-color:var(--gold);color:#fff}.nav .ico{width:25px;display:inline-block}.main{flex:1;padding:24px;overflow:auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px}.topbar h1{margin:0;font:28px Georgia;color:var(--green)}.sub{color:var(--muted);margin-top:4px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:13px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:var(--shadow)}.card small{color:var(--muted)}.money{font:21px monospace;margin-top:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}.primary,.secondary,.dangerbtn{padding:9px 13px;border-radius:6px;cursor:pointer}.primary{background:var(--green2);color:#fff;border:0}.secondary{background:#fff;color:var(--green);border:1px solid #bdc9c0}.dangerbtn{background:#fff;color:var(--danger);border:1px solid #d8b4b4}.search{max-width:360px}input,select,textarea{padding:9px;border:1px solid #cbd5cd;border-radius:6px;background:#fff;width:100%;font:inherit}.field{margin-bottom:12px;flex:1}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.row{display:flex;gap:10px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:8px}table{width:100%;border-collapse:collapse;background:#fff;min-width:650px}th{text-align:left;font-size:11px;color:var(--green);border-bottom:2px solid var(--green);padding:10px}td{padding:9px;border-bottom:1px solid var(--line)}td.r,th.r{text-align:right}.empty{padding:24px;background:#fff;border:1px dashed #cbd5cd;border-radius:8px;color:var(--muted)}.modalbg{position:fixed;z-index:20;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:14px}.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:#f9fbf8;border-radius:12px;padding:20px;box-shadow:0 20px 60px #0005}.modal h2{font:22px Georgia;margin:0 0 16px}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.logoPreview{max-height:75px;max-width:190px;border-radius:8px}.badge{display:inline-block;padding:4px 7px;border-radius:99px;background:#edf3ed;color:var(--green);font-size:11px}.chart{width:100%;height:230px}.muted{color:var(--muted)}.right{text-align:right}.lock{position:fixed;inset:0;background:var(--green);z-index:99;display:flex;align-items:center;justify-content:center;color:#fff}.lockbox{width:min(360px,92%);background:#fff;color:var(--text);padding:25px;border-radius:14px;text-align:center}.lockbox h2{font:25px Georgia;color:var(--green)}.toast{position:fixed;right:18px;bottom:18px;background:var(--green);color:#fff;padding:11px 15px;border-radius:8px;display:none;z-index:100}.website-bar{position:sticky;top:0;z-index:9999;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:#0f172a;color:#fff}.website-brand{font-weight:800}.website-sub{font-size:12px;opacity:.75}.website-actions{display:flex;gap:8px}.website-actions a,.website-actions button{color:#fff;background:transparent;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:7px 10px;text-decoration:none;cursor:pointer}.website-actions .logout{background:#a33d3d;border-color:#a33d3d;font-weight:700}.auth-backdrop{position:fixed;inset:0;z-index:100000;background:#0f172aef;display:flex;align-items:center;justify-content:center;padding:18px}.auth-card{width:min(390px,100%);background:#fff;border-radius:14px;padding:24px;box-shadow:0 20px 60px #0007}.auth-card h2{margin:0 0 6px;font:26px Georgia;color:var(--green)}.auth-card p{margin:0 0 18px;color:var(--muted)}.auth-error{display:none;color:#a33d3d;background:#fdecec;border:1px solid #e4b7b7;padding:8px;border-radius:7px;margin:10px 0;font-size:12px}.auth-status{font-size:11px;color:var(--muted);margin-top:8px}.v4-topmenu{display:flex;gap:6px;flex-wrap:wrap;background:#eef3f7;border:1px solid #b9c7d0;padding:5px;margin:6px 0}.v4-topmenu button{background:#fff;border:1px solid #b9c7d0;padding:6px 10px;font-size:11px;cursor:pointer}.v4-f10{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.v4-f10 button{padding:9px;text-align:left;background:#fff;border:1px solid #c4ced5;cursor:pointer}.v4-help{font-size:11px;color:#637583;padding:7px 0}.format-panel{background:#f7f9fb;border:1px solid #c6d1d8;padding:12px;margin:10px 0}.format-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.format-grid label{font-size:12px;font-weight:600}.format-checks{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}.format-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.format-actions button{padding:7px 12px;border:1px solid #8da1ae;background:#fff;cursor:pointer}.cancelbtn{padding:7px 10px;border-radius:6px;cursor:pointer;background:#fff7f7;color:#a33d3d;border:1px solid #d8a8a8}.cancelled-badge{display:inline-block;padding:3px 7px;border-radius:99px;background:#fdecec;color:#9b2f2f;font-weight:700;font-size:11px}.invoice-status{font-weight:700;color:#9b2f2f;border:1px solid #d8a8a8;padding:3px 7px;display:inline-block;margin-bottom:3mm}.v9-focus{outline:2px solid #f0b400!important;outline-offset:-2px}.v9-status{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#eaf2f8;border-top:1px solid #9bb5c8;padding:5px 10px;font-size:11px;color:#294e68}.v9-status b{color:#123f5e}.v9-menuhint{font-size:10px;color:#60788a;margin:4px 20px 8px}.v9-kbd{font-family:monospace;border:1px solid #9fb2bf;background:#fff;padding:1px 4px;border-radius:2px}
@media(max-width:700px){.vfields,.vbottom{grid-template-columns:1fr}.vfield{grid-template-columns:110px 1fr}.grid2{grid-template-columns:1fr}.row{flex-direction:column}.cards{grid-template-columns:1fr}.side{width:64px}.brand b,.brand small,.nav span{display:none}.main{padding:10px}.auth-card{padding:20px}}
@media print{.website-bar,.auth-backdrop{display:none!important}}
</style>
</head>
<body>
<div class="website-bar"><div><div class="website-brand">M.BizAccount</div><div class="website-sub">GST Billing &amp; Accounting</div></div><div class="website-actions"><a href="#app">Open Software</a><button type="button" onclick="window.print()">Print</button><button type="button" class="logout" onclick="mbizLogout()">Logout</button></div></div>
<div id="authGate" class="auth-backdrop"><div class="auth-card"><h2>Admin Sign In</h2><p>Sign in to open M.BizAccount.</p><form onsubmit="mbizLogin(event)"><div class="field"><label>Admin Email</label><input id="authEmail" type="email" autocomplete="username" required placeholder="Admin email" oninput="mbizAuthApplyLockUI()"></div><div class="field"><label>Password</label><input id="authPassword" type="password" autocomplete="current-password" required placeholder="Password"></div><div id="authError" class="auth-error"></div><button id="authSubmit" class="primary" type="submit" style="width:100%">Sign In</button><div id="authStatus" class="auth-status">Secure sign-in powered by Supabase.</div></form></div></div>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-auth.js"></script>
<script src="./auth-recovery-lockout.js"></script>
<script>
function $(id){return document.getElementById(id)}
window.mbizAuthError=function(msg){const box=$("authError");if(box){box.textContent=msg;box.style.display="block"}};
window.mbizApplyAuthState=function(session){const gate=$("authGate");if(!gate)return;if(session){gate.style.display="none";if(!window.mbizAppStarted){window.mbizAppStarted=true;render();lockScreen()}}else{gate.style.display="flex";window.mbizAppStarted=false;try{if($('lock'))$('lock').remove()}catch(e){}}};
async function mbizLogin(e){if(e)e.preventDefault();const email=$("authEmail")?.value.trim();const password=$("authPassword")?.value||"";const btn=$("authSubmit");const status=$("authStatus");if(!email||!password)return;if(window.mbizAuthApplyLockUI&&window.mbizAuthApplyLockUI())return;if(!window.mbizSupabase){mbizAuthError("Authentication service is unavailable. Please refresh the page.");return}if($("authError"))$("authError").style.display="none";if(btn){btn.disabled=true;btn.textContent="Signing in..."}if(status)status.textContent="Checking your account…";try{const {error}=await window.mbizSupabase.auth.signInWithPassword({email,password});if(error)throw error;if(window.mbizAuthClearFailures)window.mbizAuthClearFailures(email);if(status)status.textContent="Signed in."}catch(err){console.error(err);const lock=window.mbizAuthRegisterFailure?window.mbizAuthRegisterFailure(email):null;if(lock){mbizAuthError(lock.minutes>1?`Wrong User ID or password. Too many failed attempts. Account locked for ${lock.minutes} minutes.`:"Wrong User ID or password. Account locked for 1 minute.")}else mbizAuthError(err?.message||"Sign in failed. Please check your email and password.");if(status)status.textContent="Secure sign-in powered by Supabase.";if(window.mbizAuthApplyLockUI)window.mbizAuthApplyLockUI()}finally{if(btn&&!window.mbizAuthApplyLockUI?.()) {btn.disabled=false;btn.textContent="Sign In"}}}
async function mbizLogout(){try{if(!window.mbizSupabase)throw new Error('Authentication service is unavailable.');const {error}=await window.mbizSupabase.auth.signOut({scope:'local'});if(error)throw error;location.reload()}catch(e){console.error(e);alert('Logout failed. Please try again.')}}
function mbizBootAuth(){if(window.mbizAuthReady){window.mbizAuthReady.catch(function(){mbizAuthError('Unable to check login session. Please refresh the page.')})}else if(window.mbizSupabase){window.mbizSupabase.auth.getSession().then(function(r){window.mbizApplyAuthState(r.data?.session||null)}).catch(function(){mbizAuthError('Unable to check login session. Please refresh the page.')})}}
const KEY="mbizaccount_v3_data";
const blank=()=>({company:{name:"M.BizAccount",logo:"",address:"",gstin:"",phone:"",email:"",bank:"",account:"",ifsc:"",terms:"Goods once sold will not be taken back.\nSubject to local jurisdiction."},parties:[],items:[],tx:[],expenses:[],counter:{sales:1,purchase:1,receipt:1,payment:1,expense:1},pin:""});
let D=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||blank()}catch(e){return blank()}})();
D.company=D.company||blank().company;D.parties=D.parties||[];D.items=D.items||[];D.tx=D.tx||D.vouchers||[];D.expenses=D.expenses||[];D.counter=D.counter||blank().counter;
let tab="gateway",activeParty=null,modal="",invoiceLines=[],searchTerm="",gatewayMenuIndex=0;
const uid=()=>Math.random().toString(36).slice(2,10), today=()=>new Date().toISOString().slice(0,10),money=n=>"₹"+(Number(n)||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2}),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function save(){localStorage.setItem(KEY,JSON.stringify(D));render()}
function no(type){let n=D.counter[type]||1;D.counter[type]=n+1;return type.slice(0,2).toUpperCase()+"-"+String(n).padStart(4,"0")}
function fyShort(dateStr){const d=new Date((dateStr||today())+"T00:00:00");const y=d.getFullYear();const start=d.getMonth()>=3?y:y-1;return String(start).slice(-2)+String(start+1).slice(-2)}
function invoicePrefix(){return (D.company.invoicePrefix||"INV/TT").trim().replace(/\s+/g,"")}
function invoiceNo(type,dateStr,consume=false){let n=D.counter[type]||1;if(consume)D.counter[type]=n+1;const prefix=type==="sales"?invoicePrefix():((D.company.purchasePrefix||"PUR/TT").trim().replace(/\s+/g,""));return prefix+"/"+fyShort(dateStr)+"/"+String(n).padStart(6,"0")}
function pname(id){return D.parties.find(p=>p.id===id)?.name||"Cash / Walk-in"}
function txEffect(v){if(v.type==="sales")return +(v.total||0);if(v.type==="purchase")return -(v.total||0);if(v.type==="receipt")return -(v.amount||0);if(v.type==="payment")return +(v.amount||0);return 0}
function totals(){let sales=0,purchases=0,gst=0,cash=0,expenses=0;D.tx.filter(v=>!v.cancelled).forEach(v=>{if(v.type==="sales"){sales+=+v.total||0;gst+=+v.gst||0;if(v.mode==="Cash")cash+=+v.total||0}if(v.type==="purchase"){purchases+=+v.total||0;gst-=+v.gst||0;if(v.mode==="Cash")cash-=+v.total||0}if(v.type==="receipt")cash+=+v.amount||0;if(v.type==="payment")cash-=+v.amount||0});D.expenses.forEach(e=>{expenses+=+e.amount||0;cash-=+e.amount||0});let rec=0,pay=0;D.parties.forEach(p=>{let b=D.tx.filter(v=>v.partyId===p.id&&!v.cancelled).reduce((a,v)=>a+txEffect(v),0);if(p.type==="customer")rec+=Math.max(0,b);else pay+=Math.max(0,-b)});let stock=D.items.reduce((a,i)=>a+(+i.stock||0)*(+i.rate||0),0);return{sales,purchases,gst,cash,expenses,rec,pay,stock,profit:sales-purchases-expenses}}
function empty(x){return `<div class="empty">${x}</div>`}
function header(t,s){return `<div class="topbar"><div><h1>${t}</h1><div class="sub">${s||""}</div></div><span class="badge">${new Date().toLocaleDateString("en-IN")}</span></div>`}
function gateway(){return header("Gateway of M.BizAccount","Keyboard-first accounting workspace")+`<div class="panel"><h3>Masters</h3><div class="actions"><button class="primary" onclick="tab='parties';render()">Customers / Suppliers</button><button class="secondary" onclick="tab='items';render()">Inventory</button></div><h3>Transactions</h3><div class="actions"><button class="primary" onclick="invoiceDialog('sales')">F8 Sales</button><button class="secondary" onclick="invoiceDialog('purchase')">F9 Purchase</button><button class="secondary" onclick="moneyDialog('payment')">F5 Payment</button><button class="secondary" onclick="moneyDialog('receipt')">F6 Receipt</button></div><h3>Reports &amp; Settings</h3><div class="actions"><button class="secondary" onclick="tab='reports';render()">Reports</button><button class="secondary" onclick="tab='settings';render()">Settings</button></div></div>`}
function gatewayActivate(){}
function parties(){return header("Customers & suppliers","Ledger balances and contact details.")+`<div class="actions"><input class="search" id="partySearch" placeholder="Search party..." value="${esc(searchTerm)}" oninput="searchTerm=this.value;renderParties()"><button class="primary" onclick="partyDialog()">+ Add party</button></div><div id="partyList"></div>`}
function renderParties(){let a=D.parties.filter(p=>(p.name+" "+p.phone+" "+p.gstin).toLowerCase().includes(searchTerm.toLowerCase()));$("partyList").innerHTML=a.length?`<div class="tablewrap"><table><thead><tr><th>Name</th><th>Type</th><th>GSTIN</th><th>Phone</th><th>Balance</th><th></th></tr></thead><tbody>${a.map(p=>{let b=D.tx.filter(v=>v.partyId===p.id).reduce((z,v)=>z+txEffect(v),0);return `<tr><td>${esc(p.name)}</td><td>${p.type}</td><td>${esc(p.gstin||"—")}</td><td>${esc(p.phone||"—")}</td><td>${money(Math.abs(b))} ${b>=0?"Dr":"Cr"}</td><td><button class="secondary" onclick="partyDialog('${p.id}')">Edit</button> <button class="dangerbtn" onclick="deleteParty('${p.id}')">Delete</button></td></tr>`}).join('')}</tbody></table></div>`:empty("No parties found.")}
function partyDialog(id){let p=D.parties.find(x=>x.id===id)||{name:"",type:"customer",gstin:"",phone:"",address:""};modal=`<div class="modalbg"><div class="modal"><h2>${id?"Edit":"Add"} party</h2><div class="field"><label>Name</label><input id="pn" value="${esc(p.name)}"></div><div class="row"><div class="field"><label>Type</label><select id="pt"><option value="customer">Customer</option><option value="supplier">Supplier</option></select></div><div class="field"><label>GSTIN</label><input id="pg" value="${esc(p.gstin)}"></div></div><div class="row"><div class="field"><label>Phone</label><input id="pp" value="${esc(p.phone)}"></div><div class="field"><label>Address</label><input id="pa" value="${esc(p.address)}"></div></div><div class="foot"><button class="secondary" onclick="modal='';render()">Cancel</button><button class="primary" onclick="saveParty('${id||""}')">Save</button></div></div></div>`;render();setTimeout(()=>$("pt").value=p.type,0)}
function saveParty(id){let p={id:id||uid(),name:$("pn").value.trim(),type:$("pt").value,gstin:$("pg").value,phone:$("pp").value,address:$("pa").value};if(!p.name)return alert("Enter a name.");if(id)D.parties=D.parties.map(x=>x.id===id?p:x);else D.parties.push(p);modal="";save()}
function deleteParty(id){if(confirm("Delete this party? Transactions will remain.")){D.parties=D.parties.filter(p=>p.id!==id);save()}}
function items(){return header("Inventory","Items, stock and GST rates.")+`<div class="actions"><button class="primary" onclick="itemDialog()">+ Add item</button></div><div id="itemList"></div>`}
function renderItems(){let a=D.items;$("itemList").innerHTML=a.length?`<div class="tablewrap"><table><thead><tr><th>Item</th><th>HSN</th><th>Unit</th><th>Rate</th><th>GST</th><th>Stock</th><th></th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.hsn||"—")}</td><td>${x.unit}</td><td>${money(x.rate)}</td><td>${x.gstRate}%</td><td>${x.stock}</td><td><button class="secondary" onclick="itemDialog('${x.id}')">Edit</button></td></tr>`).join('')}</tbody></table></div>`:empty("No items found.")}
function itemDialog(id){let x=D.items.find(i=>i.id===id)||{name:"",hsn:"",unit:"NOS",rate:0,gstRate:18,stock:0};modal=`<div class="modalbg"><div class="modal"><h2>${id?"Edit":"Add"} item</h2><div class="field"><label>Item name</label><input id="in" value="${esc(x.name)}"></div><div class="row"><div class="field"><label>HSN</label><input id="ih" value="${esc(x.hsn)}"></div><div class="field"><label>Unit</label><select id="iu">${["NOS","KG","LTR","BOX","MTR","SET"].map(u=>`<option ${x.unit===u?"selected":""}>${u}</option>`).join("")}</select></div></div><div class="row"><div class="field"><label>Rate</label><input id="ir" type="number" value="${x.rate}"></div><div class="field"><label>GST %</label><input id="ig" type="number" value="${x.gstRate}"></div><div class="field"><label>Stock</label><input id="is" type="number" value="${x.stock}"></div></div><div class="foot"><button class="secondary" onclick="modal='';render()">Cancel</button><button class="primary" onclick="saveItem('${id||""}')">Save</button></div></div></div>`;render()}
function saveItem(id){let x={id:id||uid(),name:$("in").value.trim(),hsn:$("ih").value,unit:$("iu").value,rate:+$("ir").value||0,gstRate:+$("ig").value||0,stock:+$("is").value||0};if(!x.name)return alert("Enter an item name.");if(id)D.items=D.items.map(a=>a.id===id?x:a);else D.items.push(x);modal="";save()}
function invoices(){let v=D.tx.filter(x=>x.type==="sales"||x.type==="purchase").sort((a,b)=>b.date.localeCompare(a.date));return header("Invoices","Create and manage invoices.")+`<div class="actions"><button class="primary" onclick="invoiceDialog('sales')">+ Sales invoice</button><button class="secondary" onclick="invoiceDialog('purchase')">+ Purchase invoice</button></div>`+(v.length?`<div class="tablewrap"><table><thead><tr><th>No.</th><th>Date</th><th>Type</th><th>Party</th><th>Amount</th><th>Status</th></tr></thead><tbody>${v.map(x=>`<tr><td>${esc(x.number)}</td><td>${x.date}</td><td>${x.type}</td><td>${esc(pname(x.partyId))}</td><td>${money(x.total)}</td><td>${x.cancelled?'<span class="cancelled-badge">CANCELLED</span>':'<span class="badge">ACTIVE</span>'}</td></tr>`).join('')}</tbody></table></div>`:empty("No invoices yet."))}
function invoiceDialog(type,partyId){if(!D.parties.length)return alert("Add a customer/supplier first.");if(!D.items.length)return alert("Add an item first.");invoiceLines=[{item:D.items[0].id,qty:1,rate:D.items[0].rate,gst:D.items[0].gstRate,discount:0}];modal=`<div class="modalbg"><div class="modal"><h2>${type==="sales"?"Sales Voucher":"Purchase Voucher"}</h2><div class="row"><div class="field"><label>Date</label><input id="vd" type="date" value="${today()}"></div><div class="field"><label>Party</label><select id="vp">${D.parties.map(p=>`<option value="${p.id}" ${p.id===partyId?'selected':''}>${esc(p.name)}</option>`).join("")}</select></div></div><div id="lines"></div><button class="secondary" onclick="addLine()">+ Add Item</button><div class="foot"><button class="secondary" onclick="modal='';render()">Cancel</button><button class="primary" onclick="saveInvoice('${type}')">Accept / Save</button></div></div></div>`;render();drawLines()}
function drawLines(){if(!$('lines'))return;$('lines').innerHTML=`<table><thead><tr><th>Item</th><th>Qty</th><th>Rate</th><th>GST%</th><th>Disc.%</th><th>Total</th></tr></thead><tbody>${invoiceLines.map((l,i)=>`<tr><td><select onchange="chgLine(${i},'item',this.value)">${D.items.map(x=>`<option value="${x.id}" ${x.id===l.item?'selected':''}>${esc(x.name)}</option>`).join('')}</select></td><td><input type="number" value="${l.qty}" onchange="chgLine(${i},'qty',this.value)"></td><td><input type="number" value="${l.rate}" onchange="chgLine(${i},'rate',this.value)"></td><td><input type="number" value="${l.gst}" onchange="chgLine(${i},'gst',this.value)"></td><td><input type="number" value="${l.discount||0}" onchange="chgLine(${i},'discount',this.value)"></td><td>${money(l.qty*l.rate*(1-(l.discount||0)/100)*(1+l.gst/100))}</td></tr>`).join('')}</tbody></table>`}
function chgLine(i,k,v){invoiceLines[i][k]=k==='item'?v:+v;if(k==='item'){let x=D.items.find(a=>a.id===v);invoiceLines[i].rate=x.rate;invoiceLines[i].gst=x.gstRate}drawLines()}
function addLine(){let x=D.items[0];invoiceLines.push({item:x.id,qty:1,rate:x.rate,gst:x.gstRate,discount:0});drawLines()}
function saveInvoice(type){if(!invoiceLines.length)return alert("Add at least one line.");let sub=invoiceLines.reduce((a,l)=>a+l.qty*l.rate*(1-(l.discount||0)/100),0),gst=invoiceLines.reduce((a,l)=>a+l.qty*l.rate*(1-(l.discount||0)/100)*l.gst/100,0),total=sub+gst;let v={id:uid(),type,date:$("vd").value,partyId:$("vp").value,number:invoiceNo(type,$("vd").value,true),lines:invoiceLines.map(x=>({...x})),subtotal:sub,gst,total};D.tx.push(v);invoiceLines.forEach(l=>{let x=D.items.find(i=>i.id===l.item);if(x)x.stock+=type==='sales'?-l.qty:l.qty});modal='';save()}
function payments(){let v=D.tx.filter(x=>x.type==="payment"||x.type==="receipt").sort((a,b)=>b.date.localeCompare(a.date));return header("Payments & receipts","Track money received and paid.")+`<div class="actions"><button class="primary" onclick="moneyDialog('receipt')">+ Receipt</button><button class="secondary" onclick="moneyDialog('payment')">+ Payment</button></div>`+(v.length?`<div class="tablewrap"><table><thead><tr><th>No.</th><th>Date</th><th>Type</th><th>Amount</th></tr></thead><tbody>${v.map(x=>`<tr><td>${x.number}</td><td>${x.date}</td><td>${x.type}</td><td>${money(x.amount)}</td></tr>`).join('')}</tbody></table></div>`:empty("No payments or receipts yet."))}
function moneyDialog(type,partyId){if(!D.parties.length)return alert("Add a party first.");modal=`<div class="modalbg"><div class="modal"><h2>Record ${type}</h2><div class="row"><div class="field"><label>Date</label><input id="md" type="date" value="${today()}"></div><div class="field"><label>Party</label><select id="mp">${D.parties.map(p=>`<option value="${p.id}" ${p.id===partyId?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div></div><div class="row"><div class="field"><label>Amount</label><input id="ma" type="number" min="0"></div><div class="field"><label>Mode</label><select id="mm"><option>Cash</option><option>Bank transfer</option><option>UPI</option><option>Cheque</option></select></div></div><div class="foot"><button class="secondary" onclick="modal='';render()">Cancel</button><button class="primary" onclick="saveMoney('${type}')">Save</button></div></div></div>`;render()}
function saveMoney(type){let a=+$("ma").value||0;if(a<=0)return alert("Enter amount.");D.tx.push({id:uid(),type,date:$("md").value,partyId:$("mp").value,mode:$("mm").value,amount:a,number:no(type)});modal="";save()}
function expenses(){return header("Expenses","Record business expenses.")+`<div class="actions"><button class="primary" onclick="expenseDialog()">+ Add expense</button></div>`+(D.expenses.length?`<div class="tablewrap"><table><thead><tr><th>No.</th><th>Date</th><th>Category</th><th>Amount</th></tr></thead><tbody>${D.expenses.map(e=>`<tr><td>${e.number}</td><td>${e.date}</td><td>${esc(e.category)}</td><td>${money(e.amount)}</td></tr>`).join('')}</tbody></table></div>`:empty("No expenses yet."))}
function expenseDialog(){modal=`<div class="modalbg"><div class="modal"><h2>Add expense</h2><div class="row"><div class="field"><label>Date</label><input id="ed" type="date" value="${today()}"></div><div class="field"><label>Category</label><input id="ec" value="General"></div></div><div class="row"><div class="field"><label>Note</label><input id="en"></div><div class="field"><label>Amount</label><input id="ea" type="number"></div></div><div class="foot"><button class="secondary" onclick="modal='';render()">Cancel</button><button class="primary" onclick="saveExpense()">Save</button></div></div></div>`;render()}
function saveExpense(){let a=+$("ea").value||0;if(a<=0)return alert("Enter amount.");D.expenses.push({id:uid(),date:$("ed").value,category:$("ec").value,note:$("en").value,mode:"Cash",amount:a,number:no("expense")});modal="";save()}
function reports(){let s=totals();return header("Reports","Profit & Loss and GST overview.")+`<div class="cards">${[["Sales",s.sales],["Purchases",s.purchases],["Expenses",s.expenses],["Net Profit / Loss",s.profit],["Net GST",s.gst]].map(x=>`<div class="card"><small>${x[0]}</small><div class="money">${money(x[1])}</div></div>`).join("")}</div>`}
function settings(){let c=D.company;return header("Company & security","Branding, backup and PIN lock.")+`<div class="panel"><div class="field"><label>Company name</label><input id="cn" value="${esc(c.name)}"></div><div class="field"><label>GSTIN</label><input id="cg" value="${esc(c.gstin)}"></div><div class="field"><label>Address</label><textarea id="ca">${esc(c.address)}</textarea></div><button class="primary" onclick="saveSettings()">Save company settings</button></div><div class="actions"><button class="secondary" onclick="setPin()">Set / change PIN</button><button class="dangerbtn" onclick="removePin()">Remove PIN</button></div>`}
function saveSettings(){D.company.name=$("cn").value;D.company.gstin=$("cg").value;D.company.address=$("ca").value;save();alert('Company settings saved.')}
function setPin(){let p=prompt('Set a 4-6 digit PIN:');if(p&&/^\d{4,6}$/.test(p)){D.pin=p;save()}}
function removePin(){if(!D.pin)return alert('PIN lock is not enabled.');let p=prompt('Enter current PIN:');if(p===D.pin){D.pin='';save()}else alert('Wrong PIN.')}
function page(){if(tab==='gateway')return gateway();if(tab==='dashboard')return dashboard();if(tab==='parties')return parties();if(tab==='items')return items();if(tab==='invoices')return invoices();if(tab==='payments')return payments();if(tab==='expenses')return expenses();if(tab==='reports')return reports();if(tab==='settings')return settings();return gateway()}
function dashboard(){let s=totals();return header('Dashboard','Business overview.')+`<div class="cards">${[["Sales",s.sales],["Purchases",s.purchases],["Receivable",s.rec],["Payable",s.pay],["Cash",s.cash],["Stock",s.stock],["Expenses",s.expenses],["Profit / Loss",s.profit]].map(x=>`<div class="card"><small>${x[0]}</small><div class="money">${money(x[1])}</div></div>`).join('')}</div>`}
function render(){if($("app")){$("app").innerHTML=`<div class="app"><aside class="side"><div class="brand"><div class="brandbox"><div><b>M.<i>BizAccount</i></b><small>Business accounts</small></div></div></div><div class="nav">${[["gateway","⌂","Gateway"],["dashboard","▣","Dashboard"],["parties","♟","Customers / Suppliers"],["items","▦","Inventory"],["invoices","▤","Invoices"],["payments","₹","Payments"],["expenses","◈","Expenses"],["reports","▤","Reports"],["settings","⚙","Settings"]].map(x=>`<button class="${tab===x[0]?'on':''}" onclick="tab='${x[0]}';searchTerm='';modal='';render()"><span class="ico">${x[1]}</span><span>${x[2]}</span></button>`).join('')}</div></aside><main class="main">${page()}</main></div>${modal}`;if(tab==='parties')renderParties();if(tab==='items')renderItems()}}
function lockScreen(){if(!D.pin)return;let l=document.createElement('div');l.className='lock';l.id='lock';l.innerHTML=`<div class="lockbox"><h2>🔐 M.BizAccount Locked</h2><p>Enter your PIN to continue.</p><input id="pinInput" type="password" inputmode="numeric" maxlength="6"><br><br><button class="primary" onclick="unlock()">Unlock</button></div>`;document.body.appendChild(l)}
function unlock(){if($("pinInput").value===D.pin){$("lock").remove()}else alert('Wrong PIN.')}
mbizBootAuth();
</script>
</body>
</html>
