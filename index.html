iv></div><div class="v22-card"><div class="v22-label">Stock Items</div><div class="v22-value">${window.D?D.items.length:0}</div></div></div><div class="v22-short">${MBizV22.vouchers.map(x=>`<span class="v22-key">${x}</span>`).join("")}</div><div class="v22-short">${MBizV22.shortcuts.map(x=>`<span class="v22-key">${x}</span>`).join("")}</div></main></div></section>`}</script>

window.mbizApplyAuthState=function(session){const gate=$("authGate");if(!gate)return;if(session){gate.style.display="none";if(!window.mbizAppStarted){window.mbizAppStarted=true;render();lockScreen()}}else{gate.style.display="flex";window.mbizAppStarted=false;try{if($('lock'))$('lock').remove()}catch(e){}}};

async function mbizLogout(){const btn=document.querySelector('.website-actions .logout');if(btn){btn.disabled=true;btn.textContent='Logging out...'}try{if(!window.mbizSupabase)throw new Error('Authentication service is unavailable.');const {error}=await window.mbizSupabase.auth.signOut({scope:'local'});if(error)throw error;try{sessionStorage.clear()}catch(e){}try{localStorage.removeItem('mbizaccount_admin_session')}catch(e){}window.location.reload()}catch(e){console.error(e);if(btn){btn.disabled=false;btn.textContent='Logout'}alert('Logout failed. Please try again.')}}
window.mbizBootAuth=function(){if(window.mbizAuthReady){window.mbizAuthReady.catch(function(e){console.error(e);mbizAuthError('Unable to check login session. Please refresh the page.')})}else if(window.mbizSupabase){window.mbizSupabase.auth.getSession().then(function(r){window.mbizApplyAuthState(r.data?.session||null)}).catch(function(e){console.error(e);mbizAuthError('Unable to check login session. Please refresh the page.')})}else{mbizAuthError('Authentication service is unavailable. Please refresh the page.')}};
function $(id){return document.getElementById(id)}
const KEY="mbizaccount_v3_data";
const blank=()=>({company:{name:"M.BizAccount",logo:"",address:"",gstin:"",phone:"",email:"",bank:"",account:"",ifsc:"",terms:"Goods once sold will not be taken back.\nSubject to local jurisdiction."},parties:[],items:[],tx:[],expenses:[],counter:{sales:1,purchase:1,receipt:1,payment:1,expense:1},pin:""});
let D=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||blank()}catch(e){return blank()}})();
D.company=D.company||blank().company;D.parties=D.parties||[];D.items=D.items||[];D.tx=D.tx||D.vouchers||[];D.expenses=D.expenses||[];D.counter=D.counter||blank().counter;
let tab="gateway",activeParty=null,modal="",editing=null,invoiceLines=[],searchTerm="",gatewayMenuIndex=0;
const uid=()=>Math.random().toString(36).slice(2,10), today=()=>new Date().toISOString().slice(0,10);
const money=n=>"₹"+(Number(n)||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function save(){localStorage.setItem(KEY,JSON.stringify(D));render()}
function toast(s){$("toast").textContent=s;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",1800)}
function no(type){let n=D.counter[type]||1;D.counter[type]=n+1;return type.slice(0,2).toUpperCase()+"-"+String(n).padStart(4,"0")}
function fyShort(dateStr){const d=new Date((dateStr||today())+"T00:00:00");const y=d.getFullYear();const start=d.getMonth()>=3?y:y-1;return String(start).slice(-2)+String(start+1).slice(-2)}
function invoicePrefix(){return (D.company.invoicePrefix||"INV/TT").trim().replace(/\s+/g,"")}
function invoiceNo(type,dateStr,consume=false){let n=D.counter[type]||1;if(consume)D.counter[type]=n+1;const prefix=type==="sales"?invoicePrefix():((D.company.purchasePrefix||"PUR/TT").trim().replace(/\s+/g,""));return prefix+"/"+fyShort(dateStr)+"/"+String(n).padStart(6,"0")}
function pname(id){return D.parties.find(p=>p.id===id)?.name||"Cash / Walk-in"}
function txEffect(v){if(v.type==="sales")return +(v.total||0);if(v.type==="purchase")return -(v.total||0);if(v.type==="receipt")return -(v.amount||0);if(v.type==="payment")return +(v.amount||0);return 0}
/* DRK ACCOUNTING ENGINE V1 */
const DRK_ACCOUNTS={
  CASH:"Cash",
  BANK:"Bank",
  SALES:"Sales",
  PURCHASE:"Purchase",
  GST_OUT:"Output GST",
  GST_IN:"Input GST",
  EXPENSE:"Expenses",
  CAPITAL:"Capital"
};

function drkAccountName(id,type){
  if(id){
    const p=D.parties.find(x=>x.id===id);
    if(p)return p.name;
  }
  if(type==="sales"||type==="receipt")return DRK_ACCOUNTS.CASH;
  if(type==="purchase"||type==="payment")return DRK_ACCOUNTS.CASH;
  return "General";
}

function drkPosting(v){
  if(!v||v.cancelled)return [];
  const total=Number(v.total||v.amount||0);
  const gst=Number(v.gst||0);
  if(total<=0)return [];

  const rows=[];
  const party=drkAccountName(v.partyId,v.type);

  if(v.type==="sales"){
    const net=Math.max(0,total-gst);
    rows.push({account: v.mode==="Cash"?DRK_ACCOUNTS.CASH:party,dr:total,cr:0});
    if(net)rows.push({account:DRK_ACCOUNTS.SALES,dr:0,cr:net});
    if(gst)rows.push({account:DRK_ACCOUNTS.GST_OUT,dr:0,cr:gst});
  }else if(v.type==="purchase"){
    const net=Math.max(0,total-gst);
    rows.push({account:DRK_ACCOUNTS.PURCHASE,dr:net,cr:0});
    if(gst)rows.push({account:DRK_ACCOUNTS.GST_IN,dr:gst,cr:0});
    rows.push({account:v.mode==="Cash"?DRK_ACCOUNTS.CASH:party,dr:0,cr:total});
  }else if(v.type==="receipt"){
    rows.push({account:DRK_ACCOUNTS.CASH,dr:total,cr:0});
    rows.push({account:party,dr:0,cr:total});
  }else if(v.type==="payment"){
    rows.push({account:party,dr:total,cr:0});
    rows.push({account:DRK_ACCOUNTS.CASH,dr:0,cr:total});
  }else if(v.type==="expense"){
    rows.push({account:v.category||DRK_ACCOUNTS.EXPENSE,dr:total,cr:0});
    rows.push({account:DRK_ACCOUNTS.CASH,dr:0,cr:total});
  }else if(v.type==="contra"){
    const from=v.from||DRK_ACCOUNTS.CASH;
    const to=v.to||DRK_ACCOUNTS.BANK;
    rows.push({account:to,dr:total,cr:0});
    rows.push({account:from,dr:0,cr:total});
  }else if(v.type==="journal"){
    const debitAccount=String(v.debitAccount||"").trim();
    const creditAccount=String(v.creditAccount||"").trim();
    const debit=Number(v.debit||0);
    const credit=Number(v.credit||0);

    if(debitAccount&&debit>0)
      rows.push({account:debitAccount,dr:debit,cr:0});

    if(creditAccount&&credit>0)
      rows.push({account:creditAccount,dr:0,cr:credit});
  }

  return rows.filter(x=>x.dr||x.cr);
}

function drkLedger(){
  const out={};
  const add=(name,dr,cr,date,no,type)=>{
    if(!name)return;
    if(!out[name])out[name]={account:name,dr:0,cr:0,entries:[]};
    out[name].dr+=dr;
    out[name].cr+=cr;
    out[name].entries.push({date,no,type,dr,cr});
  };

  D.tx.filter(v=>!v.cancelled).forEach(v=>{
    drkPosting(v).forEach(x=>add(x.account,x.dr,x.cr,v.date,v.number||"",v.type));
  });

  D.expenses.forEach(e=>{
    if(Number(e.amount)>0){
      drkPosting({...e,type:"expense",total:e.amount}).forEach(x=>
        add(x.account,x.dr,x.cr,e.date,e.number||"",e.type)
      );
    }
  });

  return Object.values(out);
}

function drkTrialBalance(){
  return drkLedger().map(a=>({
    account:a.account,
    debit:a.dr,
    credit:a.cr,
    balance:a.dr-a.cr
  })).filter(a=>a.debit||a.credit);
}

function drkAccountingCheck(){
  const tb=drkTrialBalance();
  const debit=tb.reduce((a,x)=>a+x.debit,0);
  const credit=tb.reduce((a,x)=>a+x.credit,0);
  return {
    debit,
    credit,
    difference:debit-credit,
    balanced:Math.abs(debit-credit)<0.005
  };
}
/* END DRK ACCOUNTING ENGINE V1 */

function totals(){let sales=0,purchases=0,gst=0,cash=0,expenses=0;D.tx.filter(v=>!v.cancelled).forEach(v=>{if(v.type==="sales"){sales+=+v.total||0;gst+=+v.gst||0;if(v.mode==="Cash")cash+=+v.total||0}if(v.type==="purchase"){purchases+=+v.total||0;gst-=+v.gst||0;if(v.mode==="Cash")cash-=+v.total||0}if(v.type==="receipt")cash+=+v.amount||0;if(v.type==="payment")cash-=+v.amount||0});D.expenses.forEach(e=>{expenses+=+e.amount||0;cash-=+e.amount||0});let rec=0,pay=0;D.parties.forEach(p=>{let b=D.tx.filter(v=>v.partyId===p.id&&!v.cancelled).reduce((a,v)=>a+txEffect(v),0);if(p.type==="customer")rec+=Math.max(0,b);else pay+=Math.max(0,-b)});let stock=D.items.reduce((a,i)=>a+(+i.stock||0)*(+i.rate||0),0);return{sales,purchases,gst,cash,expenses,rec,pay,stock,profit:sales-purchases-expenses}}
function header(title,sub){return `<div class="topbar"><div><h1>${title}</h1><div class="sub">${sub||""}</div></div><span class="badge">${new Date().toLocaleDateString("en-IN")}</span></div>`}

function gateway(){let fy="1-Apr-"+new Date().getFullYear()+" to 31-Mar-"+(new Date().getFullYear()+1);let last=D.tx.length?[...D.tx].sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0].date:"No entries";const menu=[["Create / Alter","parties"],["Chart of Accounts","parties"],["Stock Items / Inventory","items"],["Vouchers","voucher"],["Day Book","payments"],["Expenses","expenses"],["Banking","payments"],["Import / Search","search"],["Balance Sheet","reports"],["Profit & Loss A/c","reports"],["Trial Balance / GST","reports"],["Stock Summary","reports"],["Outstanding","reports"],["Display More Reports","reports"],["Quit / Dashboard","dashboard"]];let mi=Math.max(0,Math.min(gatewayMenuIndex||0,menu.length-1));return `<div class="classic-gateway" tabindex="0"><div class="cg-top"><div class="cg-brand">M.BizAccount<small>ACCOUNTING SOFTWARE V13</small></div><div class="cg-menu-top"><span>MANAGE</span><span onclick="tab='settings';render()">K: Company</span><span onclick="tab='settings';render()">Y: Data</span><span>Z: Exchange</span><button class="cg-goto" onclick="tab='search';render()">G: Go To</button></div><div class="cg-actions"><span>O: Import</span><span>E: Export</span><span>M: Share</span><span>P: Print</span><span>F1: Help</span></div></div><div class="cg-body"><div class="cg-left"><div class="cg-period"><div><span class="cg-head">CURRENT PERIOD</span><b>${fy}</b></div><div><span class="cg-head">CURRENT DATE</span><b>${new Date((D.workingDate||today())+"T00:00:00").toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</b></div></div><div class="cg-headrow"><span class="cg-head">NAME OF COMPANY</span><span class="cg-head">DATE OF LAST ENTRY</span></div><div class="cg-row"><div>${esc(D.company.name||"M.BizAccount")}</div><div>${last}</div></div><div class="v9-menuhint"><span class="v9-kbd">↑</span> <span class="v9-kbd">↓</span> Move &nbsp; <span class="v9-kbd">Enter</span> Select &nbsp; <span class="v9-kbd">Esc</span> Back</div></div><div class="cg-center"><div class="cg-box"><div class="cg-title">Gateway of M.BizAccount</div><div class="cg-section">Masters</div>${menu.slice(0,3).map((m,i)=>`<button id="gateway-item-${i}" class="cg-item ${i===mi?'selected v9-focus':''}" tabindex="${i===mi?0:-1}" data-gindex="${i}" onclick="gatewayActivate(${i})">${m[0]}</button>`).join("")}<div class="cg-section">Transactions</div>${menu.slice(3,6).map((m,j)=>{let i=j+3;return `<button id="gateway-item-${i}" class="cg-item ${i===mi?'selected v9-focus':''}" tabindex="${i===mi?0:-1}" data-gindex="${i}" onclick="gatewayActivate(${i})">${m[0]}</button>`}).join("")}<div class="cg-section">Utilities</div>${menu.slice(6,8).map((m,j)=>{let i=j+6;return `<button id="gateway-item-${i}" class="cg-item ${i===mi?'selected v9-focus':''}" tabindex="${i===mi?0:-1}" data-gindex="${i}" onclick="gatewayActivate(${i})">${m[0]}</button>`}).join("")}<div class="cg-section">Reports</div>${menu.slice(8,14).map((m,j)=>{let i=j+8;return `<button id="gateway-item-${i}" class="cg-item ${i===mi?'selected v9-focus':''}" tabindex="${i===mi?0:-1}" data-gindex="${i}" onclick="gatewayActivate(${i})">${m[0]}</button>`}).join("")}<button id="gateway-item-14" class="cg-item cg-quit ${mi===14?'selected v9-focus':''}" tabindex="${mi===14?0:-1}" data-gindex="14" onclick="gatewayActivate(14)">Quit / Dashboard</button></div></div><div class="cg-right"><button class="cg-key" onclick="dateDialog()"><b>F2:</b><span>Date</span></button><button class="cg-key" onclick="tab='settings';render()"><b>F3:</b><span>Company</span></button><button class="cg-key" onclick="contraDialog()"><b>F4:</b><span>Contra</span></button><button class="cg-key" onclick="moneyDialog('payment')"><b>F5:</b><span>Payment</span></button><button class="cg-key" onclick="moneyDialog('receipt')"><b>F6:</b><span>Receipt</span></button><button class="cg-key" onclick="journalDialog()"><b>F7:</b><span>Journal</span></button><button class="cg-key" onclick="invoiceDialog('sales')"><b>F8:</b><span>Sales</span></button><button class="cg-key" onclick="invoiceDialog('purchase')"><b>F9:</b><span>Purchase</span></button><button class="cg-key" onclick="voucherMenu()"><b>F10:</b><span>Vouchers</span></button><button class="cg-key" onclick="tab='settings';render()"><b>F11:</b><span>Features</span></button><button class="cg-key" onclick="tab='settings';render()"><b>F12:</b><span>Configure</span></button></div></div><div class="v9-status"><span><b>Enter</b> Select/Accept &nbsp; <b>Esc</b> Back &nbsp; <b>↑↓</b> Navigate</span><span><b>F8</b> Sales &nbsp; <b>F9</b> Purchase</span></div><div class="cg-footer">M.BizAccount V13 · Keyboard-first workflow · Tally-like accounting navigation</div></div>`}
function gatewayActivate(i){gatewayMenuIndex=i;const actions=[()=>{tab="parties";activeParty=null;render()},()=>{tab="parties";activeParty=null;render()},()=>{tab="items";render()},()=>voucherMenu(),()=>{tab="payments";render()},()=>{tab="expenses";render()},()=>{tab="payments";render()},()=>{tab="search";render()},()=>{tab="reports";render()},()=>{tab="reports";render()},()=>{tab="reports";render()},()=>{tab="reports";render()},()=>{tab="reports";render()},()=>{tab="reports";render()},()=>{tab="dashboard";render()}];actions[i]()}

function saveJournal(){
  const date=$("jd")?.value||today();

  let outputGst=D.tx.filter(x=>x.type==="sales"&&!x.cancelled).reduce((a,x)=>a+(+x.gst||0),0);
  let inputGst=D.tx.filter(x=>x.type==="purchase"&&!x.cancelled).reduce((a,x)=>a+(+x.gst||0),0);

  return header("Profit & Loss / GST","Business performance and tax summary.")
  +`<div class="cards">
    ${[
      ["Sales",s.sales],
      ["Purchases",s.purchases],
      ["Expenses",s.expenses],
      ["Net Profit / Loss",s.profit],
      ["Output GST",outputGst],
      ["Input GST",inputGst],
      ["Net GST",s.gst]
    ].map(x=>`<div class="card"><small>${x[0]}</small><div class="money">${money(x[1])}</div></div>`).join("")}
  </div>

  <div class="grid2" style="margin-top:15px">
    <div class="panel">
      <h3>Profit & Loss</h3>
      ${table(["Particular","Amount"],[
        ["Sales",money(s.sales)],
        ["Less: Purchases",money(s.purchases)],
        ["Less: Expenses",money(s.expenses)],
        ["Net Profit / Loss",`<b>${money(s.profit)}</b>`]
      ])}
    </div>

    <div class="panel">
      <h3>GST summary</h3>
      ${table(["Particular","Amount"],[
        ["Output GST (sales)",money(outputGst)],
        ["Input GST (purchases)",money(inputGst)],
        ["Net GST",`<b>${money(s.gst)}</b>`]
      ])}
    </div>
  </div>

  ${drkTrialBalancePanel()}`
}

ail)}"></div></div><div class="row"><div class="field"><label>Bank</label><input id="cb" value="${esc(c.bank)}"></div><div class="field"><label>Account</label><input id="cba" value="${esc(c.account)}"></div><div class="field"><label>IFSC</label><input id="ci" value="${esc(c.ifsc)}"></div></div><div class="row"><div class="field"><label>Sales Invoice Prefix</label><input id="cip" value="${esc(c.invoicePrefix||"INV/TT")}" placeholder="e.g. CLS/TT"></div><div class="field"><label>Purchase Invoice Prefix</label><input id="cipu" value="${esc(c.purchasePrefix||"PUR/TT")}" placeholder="e.g. PUR/TT"></div></div><div class="field"><label><input id="autoInvoiceQR" type="checkbox" ${c.autoInvoiceQR!==false?"checked":""} style="width:auto;margin-right:6px"> Automatically generate QR on every invoice</label><small class="muted">The QR uses the invoice number, date, party and amount. If a UPI ID is saved above, it becomes a payment QR.</small></div><div class="field"><label>Invoice terms</label><textarea id="ct" rows="3">${esc(c.terms)}</textarea></div><button class="primary" onclick="saveSettings()">Save company settings</button></div><br><div class="actions"><button class="secondary" onclick="backup()">Export backup</button><button class="secondary" onclick="restore()">Import backup</button><button class="secondary" onclick="setPin()">Set / change PIN</button><button class="dangerbtn" onclick="removePin()">Remove PIN</button></div>${invoiceDesigner()}`}

function backup(){
try{
const json=JSON.stringify(D,null,2);
const blob=new Blob([json],{type:"application/json;charset=utf-8"});
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;
a.download="DRK-Co-backup-"+new Date().toISOString().slice(0,10)+".json";
document.body.appendChild(a);
a.click();
a.remove();
setTimeout(()=>URL.revokeObjectURL(url),1000);
}catch(e){
console.error("Backup export failed:",e);
alert("Backup export failed. Please try again.");
}
}
function restore(){let i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);let data=x.data||x;if(!data.company||!data.tx)throw 0;if(!confirm("Restore this backup? Current data will be replaced."))return;D=data;save();toast("Backup restored successfully");render()}catch(e){alert("Invalid DRK.Co backup file")}};if(i.files[0])r.readAsText(i.files[0])};i.click()}

axable)}</th><th></th><th class="n">${money(cgst)}</th><th></th><th class="n">${money(sgst)}</th><th class="n">${money(gst)}</th></tr>`;let rows=lines.map((l,i)=>{const x=D.items.find(a=>a.id===l.item)||{},base=(+l.qty||0)*(+l.rate||0),disc=base*(+l.discount||0)/100,line=base-disc;return `<tr><td class="c">${i+1}</td><td>${esc(x.name||"")}</td><td class="c">${esc(x.hsn||"")}</td><td class="n">${esc(x.mrp||"")}</td><td class="c">${l.qty||0} ${esc(x.unit||"nos")}</td><td class="n">${money(l.rate)}</td><td class="c">${esc(x.unit||"nos")}</td><td class="n">${money(line)}</td></tr>`}).join("");rows+=Array.from({length:Math.max(0,10-lines.length)},()=>'<tr><td>&nbsp;</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>').join("");const buyerAddress=esc(p.address||"").replace(/\n/g,"<br>"),sellerAddress=esc(c.address||"").replace(/\n/g,"<br>"),stateLine=(state,code)=>state?`State Name : ${esc(state)}${code?` &nbsp; Code : ${esc(code)}`:""}`:"",rounded=(v.roundedOff!==undefined)?+v.roundedOff:(total-Math.round(total)),quantityTotal=lines.reduce((a,l)=>a+(+l.qty||0),0),unitTotal=esc((D.items.find(i=>i.id===lines[0]?.item)||{}).unit||"nos");return `<div class="tallyref-page ref-copy"><div class="tallyref-copy">(${esc(copyLabel.toUpperCase())})</div><div class="tallyref-heading">GST TAX INVOICE (TT)</div>${v.cancelled?`<div class="invoice-status">CANCELLED BILL${v.cancelReason?" — "+esc(v.cancelReason):""}</div>`:""}<div class="tallyref-head"><div class="tallyref-company">${logo}<div class="tallyref-companytext"><div class="tallyref-companyname">${esc(c.name||"M.BizAccount").toUpperCase()}</div><div>${sellerAddress}</div>${c.phone?`<div>☎ Contact: ${esc(c.phone)}</div>`:""}${c.email?`<div>✉ E-Mail: ${esc(c.email)}</div>`:""}${c.gstin?`<div>GSTIN/UIN: ${esc(c.gstin)}</div>`:""}${sellerState?`<div>${stateLine(sellerState,c.stateCode)}</div>`:""}</div></div><div class="tallyref-invoicemeta"><div><b>Invoice No.:</b> ${esc(v.number||"")}</div><div><b>Dated:</b> function hashCode(str){let h=0;for(let i=0;i<str.length;i++)h=((h<<5)-h)+str.charCodeAt(i)|0;return h}
function amountWords(n){n=Math.round(Number(n)||0);if(n===0)return "Indian Rupee Zero Only";const o=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"],t=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];function w(x){if(x<20)return o[x];if(x<100)return t[Math.floor(x/10)]+(x%10?" "+o[x%10]:"");if(x<1000)return o[Math.floor(x/100)]+" Hundred"+(x%100?" "+w(x%100):"");if(x<100000)return w(Math.floor(x/1000))+" Thousand"+(x%1000?" "+w(x%1000):"");if(x<10000000)return w(Math.floor(x/100000))+" Lakh"+(x%100000?" "+w(x%100000):"");return w(Math.floor(x/10000000))+" Crore"+(x%10000000?" "+w(x%10000000):"")}return "Indian Rupee "+w(n)+" Only"}

function invoiceHTML(v){
  ensureInvoiceSettings();
  const format=D.company.invoiceSettings.format||"classic";
  const copies=`${invoiceHTMLSingle(v,"Original for Recipient")}${invoiceHTMLSingle(v,"Duplicate for Transporter")}`;
  if(format==="classic") return `<div class="invoice-dual">${copies}</div>`;
  if(format==="professional") return `<div class="invoice-dual">${copies}</div>`;
  if(format==="simple") return `<div class="invoice-dual">${copies}</div>`;
  if(format==="a5") return `<div class="invoice-dual invoice-a5">${copies}</div>`;
  if(format==="thermal80") return `<div class="invoice-dual invoice-thermal80">${copies}</div>`;
  if(format==="thermal58") return `<div class="invoice-dual invoice-thermal58">${copies}</div>`;
  return `<div class="invoice-dual">${copies}</div>`;
}

const KeyboardV2=(()=>{
  const isField=el=>!!el&&(
    /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)||
    el.isContentEditable
  );

  const isDisabled=el=>!!el&&(el.disabled||el.getAttribute("aria-disabled")==="true");

  const closeTopOverlay=()=>{
    if(modal){
      modal="";
      render();
      return true;
    }
    const overlays=[...document.querySelectorAll(
      ".modalbg,[role=\"dialog\"],[aria-modal=\"true\"]"
    )].filter(x=>getComputedStyle(x).display!=="none");
    if(overlays.length){
      const top=overlays[overlays.length-1];
      const close=top.querySelector(
        "[data-close],.close,[aria-label*=\"close\" i],[aria-label*=\"cancel\" i]"
      );
      if(close&&!isDisabled(close)) close.click();
      else if(typeof modal!=="undefined"){modal="";render();}
      return true;
    }
    return false;
  };

  const activate=el=>{
    if(!el||isDisabled(el))return false;
    if(typeof el.click==="function"){el.click();return true;}
    return false;
  };

  const gatewayMove=dir=>{
    const items=[...document.querySelectorAll(".cg-item[data-gindex]")]
      .filter(x=>!isDisabled(x));
    if(!items.length)return false;
    gatewayMenuIndex=(gatewayMenuIndex+dir+items.length)%items.length;
    render();
    setTimeout(()=>{
      document.querySelector(
        `[data-gindex="${gatewayMenuIndex}"]`
      )?.focus();
    },0);
    return true;
  };

  const listMove=dir=>{
    const active=document.activeElement;
    const items=[...document.querySelectorAll(
      '[role="option"],[role="menuitem"],[role="tab"],.cg-item,.v4-f10 button'
    )].filter(x=>!isDisabled(x)&&x.offsetParent!==null);
    if(!items.length)return false;
    let i=items.indexOf(active);
    if(i<0)i=dir>0?0:items.length-1;
    else i=(i+dir+items.length)%items.length;
    items[i].focus();
    items[i].scrollIntoView({block:"nearest",inline:"nearest"});
    return true;
  };

  const enter=e=>{
    const el=document.activeElement;
    if(isDisabled(el))return;
    if(isField(el)){
      if(el.tagName==="INPUT"&&el.type==="search"){
        e.preventDefault();
        el.dispatchEvent(new Event("change",{bubbles:true}));
      }
      return;
    }
    if(el&&(
      el.matches("button,a,[role=\"button\"],[role=\"menuitem\"],[role=\"option\"],[role=\"tab\"],.card,[data-action]")
    )){
      e.preventDefault();
      activate(el);
      return;
    }
    if(!modal&&tab==="gateway"){
      const selected=document.querySelector(".cg-item.selected");
      if(selected){e.preventDefault();activate(selected);}
    }
  };

  const arrows=e=>{
    if(isField(document.activeElement))return false;
    const gatewayEl=document.querySelector(".classic-gateway");
    if(gatewayEl&&!modal&&tab==="gateway"){
      if(e.key==="ArrowDown"||e.key==="ArrowRight")
        return gatewayMove(1);
      if(e.key==="ArrowUp"||e.key==="ArrowLeft")
        return gatewayMove(-1);
    }
    if(e.key==="ArrowDown")return listMove(1);
    if(e.key==="ArrowUp")return listMove(-1);
    return false;
  };

  const onKeyDown=e=>{
    const key=e.key;
    const field=isField(e.target);

    if(key==="Escape"){
      if(field&&e.target.value&&e.target===document.activeElement)return;
      if(closeTopOverlay()){e.preventDefault();return;}
      return;
    }

    if(key==="Enter"){
      if(e.isComposing)return;
      enter(e);
      return;
    }

    if(key==="ArrowDown"||key==="ArrowUp"||
       key==="ArrowLeft"||key==="ArrowRight"){
      if(arrows(e)){e.preventDefault();return;}
    }

    if(key==="Home"||key==="End"){
      if(field)return;
      const items=[...document.querySelectorAll(
        '[role="option"],[role="menuitem"],[role="tab"],.cg-item,.v4-f10 button'
      )].filter(x=>!isDisabled(x)&&x.offsetParent!==null);
      if(items.length){
        e.preventDefault();
        items[key==="Home"?0:items.length-1].focus();
      }
      return;
    }

    if(key==="F1"){
      e.preventDefault();
      alert("M.BizAccount V10\nKeyboard System V2\nF2 Date • F3 Company • F4 Contra • F5 Payment • F6 Receipt • F7 Journal • F8 Sales • F9 Purchase • F10 Vouchers • F11 Features • F12 Configure");
      return;
    }
    if(key==="F2"){e.preventDefault();dateDialog();return;}
    if(key==="F3"){e.preventDefault();tab="settings";render();return;}
    if(key==="F4"){e.preventDefault();contraDialog();return;}
    if(key==="F5"){e.preventDefault();if(D.parties.length)moneyDialog("payment");return;}
    if(key==="F6"){e.preventDefault();if(D.parties.length)moneyDialog("receipt");return;}
    if(key==="F7"){e.preventDefault();journalDialog();return;}
    if(key==="F8"){e.preventDefault();if(D.parties.length&&D.items.length)invoiceDialog("sales");return;}
    if(key==="F9"){e.preventDefault();if(D.parties.length&&D.items.length)invoiceDialog("purchase");return;}
    if(key==="F10"){e.preventDefault();voucherMenu();return;}
    if(key==="F11"){e.preventDefault();tab="settings";render();return;}
    if(key==="F12"){e.preventDefault();tab="settings";render();return;}

    if(e.altKey&&key.toLowerCase()==="f"){
      e.preventDefault();tab="search";render();return;
    }
    if(e.ctrlKey&&key.toLowerCase()==="q"){
      e.preventDefault();tab="gateway";modal="";render();return;
    }
    if(e.ctrlKey&&key.toLowerCase()==="p"&&modal){
      e.preventDefault();window.print();return;
    }
  };

  document.addEventListener("keydown",onKeyDown,false);
  return {activate,closeTopOverlay};
})();
