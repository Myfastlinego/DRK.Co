<style>
:root{--green:#173b2b;--green2:#28563f;--gold:#b8892f;--bg:#eef2eb;--card:#fff;--text:#1e2b24;--muted:#66756c;--line:#d7ded6;--danger:#a33d3d;--shadow:0 5px 18px #173b2b12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}.app{display:flex;min-height:100vh}.side{width:245px;background:var(--green);color:#fff;padding:16px 0;position:sticky;top:0;height:100vh;overflow:auto}.brand{padding:6px 18px 18px;border-bottom:1px solid #ffffff20}.brandbox{display:flex;gap:10px;align-items:center}.brandlogo{width:42px;height:42px;object-fit:contain;border-radius:8px;background:#fff;padding:3px}.brand b{font:23px Georgia}.brand b i{color:#d3ad5a;font-style:normal}.brand small{display:block;color:#b9c7bf;margin-top:3px}.nav{padding-top:8px}.nav button{display:block;width:100%;padding:12px 18px;background:none;border:0;border-left:3px solid transparent;color:#dce6df;text-align:left;font-size:14px}.nav button:hover,.nav button.on{background:#ffffff12;border-left-color:var(--gold);color:#fff}.nav .ico{width:25px;display:inline-block}.main{flex:1;padding:24px;overflow:auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px}.topbar h1{margin:0;font:28px Georgia;color:var(--green)}.sub{color:var(--muted);margin-top:4px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:13px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:var(--shadow)}.card small{color:var(--muted)}.money{font:21px monospace;margin-top:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}.primary,.secondary,.dangerbtn{padding:9px 13px;border-radius:6px;cursor:pointer}.primary{background:var(--green2);color:#fff;border:0}.secondary{background:#fff;color:var(--green);border:1px solid #bdc9c0}.dangerbtn{background:#fff;color:var(--danger);border:1px solid #d8b4b4}.search{max-width:360px}input,select,textarea{padding:9px;border:1px solid #cbd5cd;border-radius:6px;background:#fff;width:100%;font:inherit}.field{margin-bottom:12px;flex:1}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.row{display:flex;gap:10px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:8px}table{width:100%;border-collapse:collapse;background:#fff;min-width:650px}th{text-align:left;font-size:11px;color:var(--green);border-bottom:2px solid var(--green);padding:10px}td{padding:9px;border-bottom:1px solid var(--line)}td.r,th.r{text-align:right}.empty{padding:24px;background:#fff;border:1px dashed #cbd5cd;border-radius:8px;color:var(--muted)}.modalbg{position:fixed;z-index:20;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:14px}.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:#f9fbf8;border-radius:12px;padding:20px;box-shadow:0 20px 60px #0005}.modal h2{font:22px Georgia;margin:0 0 16px}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.logoPreview{max-height:75px;max-width:190px;border-radius:8px}.badge{display:inline-block;padding:4px 7px;border-radius:99px;background:#edf3ed;color:var(--green);font-size:11px}.chart{width:100%;height:230px}.muted{color:var(--muted)}.right{text-align:right}.lock{position:fixed;inset:0;background:var(--green);z-index:99;display:flex;align-items:center;justify-content:center;color:#fff}.lockbox{width:min(360px,92%);background:#fff;color:var(--text);padding:25px;border-radius:14px;text-align:center}.lockbox h2{font:25px Georgia;color:var(--green)}.toast{position:fixed;right:18px;bottom:18px;background:var(--green);color:#fff;padding:11px 15px;border-radius:8px;display:none;z-index:100}.invoiceprint{max-width:900px;margin:auto;background:#fff;padding:28px}.invoiceprint table{min-width:0}.invoiceprint th{color:#111;border-color:#111}.invoiceprint td{border-color:#ccc}.voucher{background:#fff;border:1px solid #aeb9b1;border-radius:6px;box-shadow:0 4px 16px #173b2b18}.vhead{background:#edf2ed;border-bottom:1px solid #bfc9c1;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}.vtitle{font:20px Georgia;color:#173b2b}.vbody{padding:14px}.vfields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.vfield{display:grid;grid-template-columns:145px 1fr;align-items:center;gap:8px}.vfield label{font-size:12px;color:#526159}.vtable{margin-top:12px;border:1px solid #aeb9b1}.vtable table{min-width:0}.vtable th{background:#edf2ed;border-bottom:1px solid #aeb9b1}.vbottom{display:grid;grid-template-columns:1fr 320px;gap:15px;margin-top:12px}.hotkeys{font-size:11px;color:#68766e;line-height:1.8}.totals{border:1px solid #bfc9c1;padding:10px;background:#f8faf7}.totals div{display:flex;justify-content:space-between;padding:3px}.totals .grand{font-weight:bold;border-top:1px solid #aeb9b1;margin-top:5px;padding-top:8px}
@media(max-width:700px){.vfields,.vbottom{grid-template-columns:1fr}.vfield{grid-template-columns:110px 1fr}}@media(max-width:800px){.side{width:64px}.brand{padding:8px}.brand b,.brand small,.nav span{display:none}.nav button{padding:13px 18px}.main{padding:15px}.grid2{grid-template-columns:1fr}.row{flex-direction:column}.topbar{align-items:flex-start}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.cards{grid-template-columns:1fr}.main{padding:10px}.card,.panel{padding:13px}}
@media print{body{background:#fff}.noprint{display:none!important}.invoiceprint{padding:0;max-width:none}.side,.main>.topbar{display:none!important}}

.website-brand{font-weight:800}.website-sub{font-size:12px;opacity:.75}.website-actions{display:flex;gap:8px}.website-actions a,.website-actions button{color:#fff;background:transparent;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:7px 10px;text-decoration:none;cursor:pointer}

<body>
<div class="website-bar">
  <div><div class="website-brand">M.BizAccount</div><div class="website-sub">GST Billing &amp; Accounting</div></div>

<div id="app"></div><div id="toast" class="toast"></div>
<script>
const KEY="mbizaccount_v3_data";
const blank=()=>({company:{name:"M.BizAccount",logo:"",address:"",gstin:"",phone:"",email:"",bank:"",account:"",ifsc:"",terms:"Goods once sold will not be taken back.\\nSubject to local jurisdiction."},parties:[],items:[],tx:[],expenses:[],counter:{sales:1,purchase:1,receipt:1,payment:1,expense:1},pin:""});
let D=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||blank()}catch(e){return blank()}})();
D.company=D.company||blank().company;D.parties=D.parties||[];D.items=D.items||[];D.tx=D.tx||D.vouchers||[];D.expenses=D.expenses||[];D.counter=D.counter||blank().counter;
let tab="gateway",activeParty=null,modal="",editing=null,invoiceLines=[],searchTerm="",gatewayMenuIndex=0;
const $=id=>document.getElementById(id), uid=()=>Math.random().toString(36).slice(2,10), today=()=>new Date().toISOString().slice(0,10);
const money=n=>"₹"+(Number(n)||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function save(){localStorage.setItem(KEY,JSON.stringify(D));render()}
function toast(s){$("toast").textContent=s;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",1800)}
function no(type){let n=D.counter[type]||1;D.counter[type]=n+1;return type.slice(0,2).toUpperCase()+"-"+String(n).padStart(4,"0")}
function fyShort(dateStr){const d=new Date((dateStr||today())+"T00:00:00");const y=d.getFullYear();const start=d.getMonth()>=3?y:y-1;return String(start).slice(-2)+String(start+1).slice(-2)}
function invoicePrefix(){return (D.company.invoicePrefix||"INV/TT").trim().replace(/\s+/g,"")}
function invoiceNo(type,dateStr,consume=false){let n=D.counter[type]||1;if(consume)D.counter[type]=n+1;const prefix=type==="sales"?invoicePrefix():((D.company.purchasePrefix||"PUR/TT").trim().replace(/\s+/g,""));return prefix+"/"+fyShort(dateStr)+"/"+String(n).padStart(6,"0")}
function pname(id){return D.parties.find(p=>p.id===id)?.name||"Cash / Walk-in"}
function txEffect(v){if(v.type==="sales")return +(v.total||0);if(v.type==="purchase")return -(v.total||0);if(v.type==="receipt")return -(v.amount||0);if(v.type==="payment")return +(v.amount||0);return 0}
function totals(){let sales=0,purchases=0,gst=0,cash=0,expenses=0;D.tx.filter(v=>!v.cancelled).forEach(v=>{if(v.type==="sales"){sales+=+v.total||0;gst+=+v.gst||0;if(v.mode==="Cash")cash+=+v.total||0}if(v.type==="purchase"){purchases+=+v.total||0;gst-=+v.gst||0;if(v.mode==="Cash")cash-=+v.total||0}if(v.type==="receipt")cash+=+v.amount||0;if(v.type==="payment")cash-=+v.amount||0});D.expenses.forEach(e=>{expenses+=+e.amount||0;cash-=+e.amount||0});let rec=0,pay=0;D.parties.forEach(p=>{let b=D.tx.filter(v=>v.partyId===p.id&&!v.cancelled).reduce((a,v)=>a+txEffect(v),0);if(p.type==="customer")rec+=Math.max(0,b);else pay+=Math.max(0,-b)});let stock=D.items.reduce((a,i)=>a+(+i.stock||0)*(+i.rate||0),0);return{sales,purchases,gst,cash,expenses,rec,pay,stock,profit:sales-purchases-expenses}}
function header(title,sub){return `<div class="topbar"><div><h1>${title}</h1><div class="sub">${sub||""}</div></div><span class="badge">${new Date().toLocaleDateString("en-IN")}</span></div>`}
function table(head,rows){return `<div class="tablewrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((x,i)=>`<td class="${i===r.length-1?'r':''}">${x}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
function gateway(){let fy="1-Apr-"+new Date().getFullYear()+" to 31-Mar-"+(new Date().getFullYear()+1),last=D.tx.length?[...D.tx].sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0].date:"No entries";const menu=[["Create / Alter","parties"],["Chart of Accounts","parties"],["Stock Items / Inventory","items"],["Vouchers","voucher"],["Day Book","payments"],["Expenses","expenses"],["Banking","payments"],["Import / Search","search"],["Balance Sheet","reports"],["Profit & Loss A/c","reports"],["Trial Balance / GST","reports"],["Stock Summary","reports"],["Outstanding","reports"],["Display More Reports","reports"],["Quit / Dashboard","dashboard"]];let mi=Math.max(0,Math.min(gatewayMenuIndex||0,menu.length-1));return `<div class="classic-gateway" tabindex="0"><div class="cg-top" style="display:flex;gap:18px;align-items:center;padding:12px;background:#2465a8;color:#fff"><div class="cg-brand">M.BizAccount<small style="display:block;font-size:9px">ACCOUNTING SOFTWARE V23</small></div><div style="flex:1"><span>MANAGE</span></div></div><div class="cg-body" style="display:grid;grid-template-columns:1fr 390px 175px;min-height:500px"><div class="cg-left" style="background:#fff;padding:34px 28px"><div class="cg-period" style="display:grid;grid-template-columns:1fr 1fr"><div><span class="cg-head">CURRENT PERIOD</span><b>${fy}</b></div><div><span class="cg-head">CURRENT DATE</span><b>${new Date((D.workingDate||today())+"T00:00:00").toLocaleDateString("en-IN")}</b></div></div><div style="margin-top:20px"><b>${esc(D.company.name||"M.BizAccount")}</b><div class="muted">Last entry: ${last}</div></div><div class="v9-menuhint" style="margin-top:20px"><span class="v9-kbd">↑</span> <span class="v9-kbd">↓</span> Move &nbsp; <span class="v9-kbd">Enter</span> Select &nbsp; <span class="v9-kbd">Esc</span> Back</div></div><div class="cg-center" style="display:flex;align-items:center;justify-content:center"><div class="cg-box" style="width:300px;background:#e1f1fb;border:1px solid #7ba8c8"><div class="cg-title" style="background:#2868ad;color:#fff;text-align:center;padding:8px;font-weight:bold">Gateway of M.BizAccount</div><div class="cg-section">Masters</div>${menu.slice(0,3).map((m,i)=>`<button id="gateway-item-${i}" class="cg-item ${i===mi?'selected':''}" tabindex="${i===mi?0:-1}" data-gindex="${i}" onclick="gatewayActivate(${i})">${m[0]}</button>`).join("")}<div class="cg-section">Transactions</div>${menu.slice(3,6).map((m,j)=>{let i=j+3;return `<button id="gateway-item-${i}" class="cg-item ${i===mi?'selected':''}" tabindex="${i===mi?0:-1}" data-gindex="${i}" onclick="gatewayActivate(${i})">${m[0]}</button>`}).join("")}<div class="cg-section">Utilities</div>${menu.slice(6,8).map((m,j)=>{let i=j+6;return `<button id="gateway-item-${i}" class="cg-item ${i===mi?'selected':''}" tabindex="${i===mi?0:-1}" data-gindex="${i}" onclick="gatewayActivate(${i})">${m[0]}</button>`}).join("")}<div class="cg-section">Reports</div>${menu.slice(8,14).map((m,j)=>{let i=j+8;return `<button id="gateway-item-${i}" class="cg-item ${i===mi?'selected':''}" tabindex="${i===mi?0:-1}" data-gindex="${i}" onclick="gatewayActivate(${i})">${m[0]}</button>`}).join("")}<button id="gateway-item-14" class="cg-item cg-quit ${mi===14?'selected':''}" tabindex="${mi===14?0:-1}" data-gindex="14" onclick="gatewayActivate(14)">Quit / Dashboard</button></div></div><div class="cg-right" style="background:#dceefa"><button class="cg-key" onclick="dateDialog()"><b>F2:</b><span>Date</span></button><button class="cg-key" onclick="tab='settings';render()"><b>F3:</b><span>Company</span></button><button class="cg-key" onclick="contraDialog()"><b>F4:</b><span>Contra</span></button><button class="cg-key" onclick="moneyDialog('payment')"><b>F5:</b><span>Payment</span></button><button class="cg-key" onclick="moneyDialog('receipt')"><b>F6:</b><span>Receipt</span></button><button class="cg-key" onclick="journalDialog()"><b>F7:</b><span>Journal</span></button><button class="cg-key" onclick="invoiceDialog('sales')"><b>F8:</b><span>Sales</span></button><button class="cg-key" onclick="invoiceDialog('purchase')"><b>F9:</b><span>Purchase</span></button><button class="cg-key" onclick="voucherMenu()"><b>F10:</b><span>Vouchers</span></button><button class="cg-key" onclick="tab='settings';render()"><b>F11:</b><span>Features</span></button><button class="cg-key" onclick="tab='settings';render()"><b>F12:</b><span>Configure</span></button></div></div><div class="v9-status" style="display:flex;justify-content:space-between;background:#eaf2f8;padding:5px 10px;font-size:11px"><span><b>Enter</b> Select/Accept &nbsp; <b>Esc</b> Back &nbsp; <b>↑↓</b> Navigate</span><span><b>F8</b> Sales &nbsp; <b>F9</b> Purchase</span></div></div>`}
function gatewayActivate(i){gatewayMenuIndex=i;const actions=[()=>{tab="parties";activeParty=null;render()},()=>{tab="parties";activeParty=null;render()},()=>{tab="items";render()},()=>voucherMenu(),()=>{tab="payments";render()},()=>{tab="expenses";render()},()=>{tab="payments";render()},()=>{tab="search";render()},()=>{tab="reports";render()},()=>{tab="reports";render()},()=>{tab="reports";render()},()=>{tab="reports";render()},()=>{tab="reports";render()},()=>{tab="reports";render()},()=>{tab="dashboard";render()}];actions[i]&&actions[i]()}
function dateDialog(){modal=`<div class="modalbg"><div class="modal"><h2>Change Date — F2</h2><div class="field"><label>Current date</label><input id="dateValue" type="date" value="${today()}"></div><div class="foot"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="setWorkingDate()">Accept</button></div></div></div>`;render();setTimeout(()=>$("dateValue")?.focus(),0)}
function setWorkingDate(){D.workingDate=$("dateValue").value||today();save();toast("Date changed")}
function closeModal(){modal="";render()}
function contraDialog(){modal=`<div class="modalbg"><div class="modal"><h2>Contra Voucher — F4</h2><div class="field"><label>Amount</label><input id="ca2" type="number" min="0"></div><div class="foot"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="closeModal()">Accept</button></div></div></div>`;render()}
function voucherMenu(){modal=`<div class="modalbg"><div class="modal"><h2>Voucher Types — F10</h2><div class="v4-f10"><button onclick="closeModal();invoiceDialog('sales')"><b>F8</b> Sales</button><button onclick="closeModal();invoiceDialog('purchase')"><b>F9</b> Purchase</button><button onclick="closeModal();moneyDialog('payment')"><b>F5</b> Payment</button><button onclick="closeModal();moneyDialog('receipt')"><b>F6</b> Receipt</button><button onclick="closeModal();journalDialog()"><b>F7</b> Journal</button></div><div class="foot"><button class="secondary" onclick="closeModal()">Close</button></div></div></div>`;render()}
function dashboard(){let s=totals();return header("Dashboard","Your complete business overview.")+`<div class="cards">${[["Sales",s.sales],["Purchases",s.purchases],["Receivable",s.rec],["Payable",s.pay],["Cash & bank",s.cash],["Stock value",s.stock],["Expenses",s.expenses],["Profit / Loss",s.profit]].map(x=>`<div class="card"><small>${x[0]}</small><div class="money">${money(x[1])}</div></div>`).join("")}</div>`}
function parties(){return header("Customers & suppliers","Ledger balances and contact details.")+`<div class="actions"><button class="primary" onclick="partyDialog()">+ Add party</button></div>`}
function items(){return header("Inventory","Items, stock, HSN and GST rates.")+`<div class="actions"><button class="primary" onclick="itemDialog()">+ Add item</button></div>`}
function invoices(){return header("Invoices","Create, edit, print, cancel and share professional invoices.")+`<div class="actions"><button class="primary" onclick="invoiceDialog('sales')">+ Sales invoice</button><button class="secondary" onclick="invoiceDialog('purchase')">+ Purchase invoice</button></div>`}
function payments(){return header("Payments & receipts","Track money received and paid.")+`<div class="actions"><button class="primary" onclick="moneyDialog('receipt')">+ Receipt</button><button class="secondary" onclick="moneyDialog('payment')">+ Payment</button></div>`}
function expenses(){return header("Expenses","Record operating and business expenses.")+`<div class="actions"><button class="primary" onclick="expenseDialog()">+ Add expense</button></div>`}
function reports(){let s=totals();return header("Profit & Loss / GST","Business performance and tax summary.")+`<div class="cards">${[["Sales",s.sales],["Purchases",s.purchases],["Expenses",s.expenses],["Net Profit / Loss",s.profit],["Net GST",s.gst]].map(x=>`<div class="card"><small>${x[0]}</small><div class="money">${money(x[1])}</div></div>`).join("")}</div>`}
function searchPage(){return header("Global search","Search invoices, transactions, parties and items.")+`<div class="actions"><input class="search" autofocus value="${esc(searchTerm)}" placeholder="Search anything..." oninput="searchTerm=this.value;render()"></div>`}
function settings(){let c=D.company||{};return header("Company & security","Branding, invoice details, backup and PIN lock.")+`<div class="panel"><div class="field"><label>Company name</label><input id="cn" value="${esc(c.name||"")}"></div><button class="primary" onclick="saveSettings()">Save company settings</button></div>`}
function saveSettings(){D.company.name=$("cn").value;save();toast("Company settings saved")}
function partyDialog(){}
function itemDialog(){}
function expenseDialog(){}
function moneyDialog(type){modal=`<div class="modalbg"><div class="modal"><h2>Record ${type}</h2><div class="field"><label>Amount</label><input id="ma" type="number" min="0"></div><div class="foot"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="closeModal()">Save</button></div></div></div>`;render()}
function invoiceDialog(type){modal=`<div class="modalbg"><div class="modal"><h2>${type==="sales"?"Sales":"Purchase"} Invoice</h2><div class="field"><label>Amount</label><input id="ia" type="number" min="0"></div><div class="foot"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="closeModal()">Accept / Save</button></div></div></div>`;render()}
function journalDialog(){moneyDialog("journal")}
function render(){if($("app")){$("app").innerHTML=`<div class="app"><aside class="side"><div class="brand"><div class="brandbox"><div><b>M.<i>BizAccount</i></b><small>Business accounts</small></div></div></div><div class="nav">${[["gateway","⌂","Gateway"],["dashboard","▣","Dashboard"],["parties","♟","Customers / Suppliers"],["items","▦","Inventory"],["invoices","▤","Invoices"],["payments","₹","Payments"],["expenses","◈","Expenses"],["reports","▤","P&L / GST"],["search","⌕","Global Search"],["settings","⚙","Settings"]].map(x=>`<button class="${tab===x[0]?'on':''}" onclick="tab='${x[0]}';activeParty=null;searchTerm='';render()"><span class="ico">${x[1]}</span><span>${x[2]}</span></button>`).join("")}</div></aside><main class="main">${page()}</main></div>${modal}`}}
function page(){if(tab==="gateway")return gateway();if(tab==="dashboard")return dashboard();if(tab==="parties")return parties();if(tab==="items")return items();if(tab==="invoices")return invoices();if(tab==="payments")return payments();if(tab==="expenses")return expenses();if(tab==="reports")return reports();if(tab==="search")return searchPage();return settings()}

/* V23 keyboard system: Enter accepts the current actionable element; Esc closes the nearest modal first, otherwise returns toward the gateway. */
(function installKeyboardSystem(){
  let enterGuard=false;
  const isEditable=el=>!!el&&((el.matches&&el.matches('input,textarea,select,[contenteditable="true"]'))||el.isContentEditable);
  const isModalOpen=()=>!!modal;
  const focusGatewayItem=index=>{const el=document.querySelector(`.cg-item[data-gindex="${index}"]`);if(el){el.focus();el.classList.add('keyboard-focus');setTimeout(()=>el.classList.remove('keyboard-focus'),140)}};
  document.addEventListener('keydown',function(e){
    if(enterGuard)return;
    const key=e.key;
    const active=document.activeElement;
    if(key==='Escape'){
      e.preventDefault();
      e.stopPropagation();
      if(isModalOpen()){
        modal='';
        render();
        return;
      }
      if(tab!=='gateway'){
        tab='gateway';
        activeParty=null;
        searchTerm='';
        gatewayMenuIndex=0;
        render();
        setTimeout(()=>focusGatewayItem(gatewayMenuIndex),0);
        return;
      }
      gatewayMenuIndex=Math.max(0,gatewayMenuIndex-1);
      render();
      setTimeout(()=>focusGatewayItem(gatewayMenuIndex),0);
      return;
    }
    if(key!=='Enter')return;
    if(isModalOpen()){
      if(isEditable(active)){
        if(active.matches('textarea'))return;
        if(active.matches('select'))return;
      }
      const submit=active?.form?.querySelector('button[type="submit"],button.primary')||document.querySelector('.modalbg .primary');
      if(submit){e.preventDefault();e.stopPropagation();enterGuard=true;try{submit.click()}finally{setTimeout(()=>enterGuard=false,0)}return;}
      return;
    }
    if(tab==='gateway'){
      const item=active?.closest?.('.cg-item[data-gindex]')||document.querySelector(`.cg-item[data-gindex="${gatewayMenuIndex}"]`);
      if(item){e.preventDefault();e.stopPropagation();enterGuard=true;try{item.click()}finally{setTimeout(()=>enterGuard=false,0)}return;}
    }
    const button=active?.matches?.('button:not([disabled]),a')?active:null;
    if(button && !isEditable(active)){
      e.preventDefault();e.stopPropagation();enterGuard=true;try{button.click()}finally{setTimeout(()=>enterGuard=false,0)}
    }
  },true);

  document.addEventListener('keydown',function(e){
    if(tab!=='gateway'||modal)return;
    const items=[...document.querySelectorAll('.cg-item[data-gindex]')];
    if(!items.length)return;
    if(e.key==='ArrowDown'||e.key==='ArrowRight'||e.key==='Tab'&&!e.shiftKey){
      if(e.key==='Tab'&&document.activeElement&&!document.activeElement.closest('.cg-item'))return;
      e.preventDefault();e.stopPropagation();gatewayMenuIndex=(gatewayMenuIndex+1)%items.length;render();setTimeout(()=>focusGatewayItem(gatewayMenuIndex),0);return;
    }
    if(e.key==='ArrowUp'||e.key==='ArrowLeft'||e.key==='Tab'&&e.shiftKey){
      if(e.key==='Tab'&&document.activeElement&&!document.activeElement.closest('.cg-item'))return;
      e.preventDefault();e.stopPropagation();gatewayMenuIndex=(gatewayMenuIndex-1+items.length)%items.length;render();setTimeout(()=>focusGatewayItem(gatewayMenuIndex),0);return;
    }
    if(e.key==='Home'){e.preventDefault();e.stopPropagation();gatewayMenuIndex=0;render();setTimeout(()=>focusGatewayItem(0),0);return;}
    if(e.key==='End'){e.preventDefault();e.stopPropagation();gatewayMenuIndex=items.length-1;render();setTimeout(()=>focusGatewayItem(items.length-1),0);}
  },false);
})();
render();
</script>
</body>
</html>
